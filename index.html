<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL - Project Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main:      #0d1117;
    --bg-card:      #1a2030;
    --bg-elevated:  #1c2333;
    --bg-hover:     rgba(255,255,255,0.025);
    --border:       rgba(255,255,255,0.07);
    --border-mid:   rgba(255,255,255,0.11);
    --text-primary:   #dde3ee;
    --text-secondary: #8892a4;
    --text-muted:     #4a5568;
    --accent:         #6366f1;
    --accent-sub:     rgba(99,102,241,0.15);
    --red:    #f47067;  --red-bg:    rgba(244,112,103,0.10);
    --amber:  #e5a44b;  --amber-bg:  rgba(229,164,75,0.10);
    --blue:   #5b8af5;  --blue-bg:   rgba(91,138,245,0.10);
    --green:  #4caf82;  --green-bg:  rgba(76,175,130,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-main); color: var(--text-primary);
    padding: 0; font-size: 15px; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #scroll-wrap {
    height: 100vh; overflow: auto;
    padding: 28px 32px; box-sizing: border-box;
  }
  h1 {
    font-size: 26px; font-weight: 600; margin-bottom: 3px; color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  /* ── Loading / Error ── */
  .loading { text-align: center; padding: 80px; color: var(--text-muted); font-size: 14px; }
  .loading-spinner {
    width: 32px; height: 32px; border: 2px solid var(--border-mid); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: var(--red-bg); border: 1px solid rgba(244,112,103,0.25); border-radius: 8px;
    padding: 14px 16px; color: var(--red); margin-bottom: 16px;
  }
  .updated-at { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 0.01em; }

  /* ── Legend ── */
  .legend { display: flex; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend-color { width: 10px; height: 10px; border-radius: 10px; opacity: 0.8; }

  /* ── Filters ── */
  .filter-group { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label {
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.07em; min-width: 32px; font-weight: 500;
  }
  .filter-btn {
    padding: 4px 11px; border-radius: 6px; border: 1px solid var(--border-mid);
    background: transparent; color: var(--text-secondary); font-size: 13px;
    cursor: pointer; transition: all 0.15s; font-family: inherit; font-weight: 500;
  }
  .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); background: var(--bg-hover); }
  .filter-btn.active { background: var(--accent-sub); border-color: rgba(99,102,241,0.4); color: #a5b4fc; }

  /* ── Summary cards ── */
  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px; text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .summary-card:hover {
    border-color: rgba(229, 164, 75, 0.35);
    box-shadow: 0 4px 14px rgba(229, 164, 75, 0.10);
    transform: translateY(-1px);
  }
  .summary-card .number {
    font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1;
  }
  .summary-card .label {
    font-size: 11px; color: var(--text-muted); margin-top: 8px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .summary-card.warn .number { color: var(--amber); }
  .summary-card.danger .number { color: var(--red); }
  .summary-card .num-total {
    font-size: 0.6em; color: var(--text-muted); font-weight: normal; letter-spacing: normal;
  }
  .summary-card.is-empty { opacity: 0.5; }
  /* Status / Schedule strip pills — clickable hover affordance */
  .strip-pill { transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease; }
  .strip-pill:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18); filter: brightness(1.12); }

  /* ── PRD Alert banner ── */
  .prd-alert {
    background: var(--amber-bg); border: 1px solid rgba(229,164,75,0.35);
    border-left: 3px solid var(--amber); border-radius: 8px;
    padding: 13px 16px; margin-bottom: 18px; display: none;
  }
  .prd-alert.show { display: block; }
  .prd-alert-title { color: var(--amber); font-weight: 700; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .prd-alert-items { font-size: 13px; color: var(--amber); line-height: 2; opacity: 0.85; }

  /* PRD Needed — collapsible PM cards */
  .prd-pm-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .prd-pm-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .prd-pm-card:hover {
    border-color: rgba(229, 164, 75, 0.35);
    box-shadow: 0 4px 14px rgba(229, 164, 75, 0.10);
    transform: translateY(-1px);
  }
  .prd-pm-header {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .prd-pm-toggle {
    font-size: 9px; color: var(--text-muted);
    transition: transform 0.15s ease;
    width: 10px; display: inline-block;
  }
  .prd-pm-card.collapsed .prd-pm-toggle { transform: rotate(-90deg); }
  .prd-pm-card.collapsed .prd-pm-items { display: none; }
  .prd-pm-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
  .prd-pm-count {
    font-size: 11px; color: var(--text-muted);
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 7px; border-radius: 9px;
    margin-left: auto;
  }
  .prd-pm-items {
    margin: 6px 0 2px 22px; padding: 0;
    font-size: 12px; line-height: 1.7;
    color: var(--text-secondary);
    list-style: decimal;
  }
  .prd-pm-items li { padding: 2px 0; }
  .prd-pm-items li::marker { color: var(--text-muted); font-size: 11px; }
  .prd-task-key { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 11px; margin-right: 4px; }
  .prd-task-state {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; margin: 0 4px;
    font-weight: 600; border: 1px solid transparent; vertical-align: 1px;
  }
  .prd-task-urgency { font-size: 11px; margin-left: 4px; }

  /* ── Timeline table ── */
  .timeline-container {
    background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); position: relative;
  }
  table.timeline thead { position: sticky; top: 0; z-index: 6; }
  table.timeline { border-collapse: collapse; table-layout: fixed; }
  table.timeline th, table.timeline td { vertical-align: middle; }

  table.timeline th.info-col {
    padding: 11px 10px; font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.07em; text-align: left;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    background: var(--bg-card); position: sticky; top: 0; z-index: 6;
  }
  .hdr-pre { display: block; font-size: 9px; line-height: 1; opacity: 0.55; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 2px; }

  /* Tour overlay (sequential walkthrough) */
  #tour-overlay { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
  #tour-overlay > * { pointer-events: auto; }
  #tour-overlay .tour-spotlight { position: fixed; border: 2px solid #fbbf24; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); pointer-events: none; }
  body.light-mode #tour-overlay .tour-spotlight { box-shadow: 0 0 0 9999px rgba(15,23,42,0.45); }
  #tour-overlay .tour-spotlight.step-change { transition: left 0.28s ease, top 0.28s ease, width 0.28s ease, height 0.28s ease; }
  #tour-overlay .tour-label-seq { position: fixed; background: rgba(255,255,255,0.98); color: #0f172a; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 13px; line-height: 1.5; z-index: 1002; }
  #tour-overlay .tour-label-seq.step-change { transition: left 0.28s ease, top 0.28s ease; }
  #tour-overlay .tour-step-num { font-size: 10px; color: #64748b; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.08em; text-transform: uppercase; }
  #tour-overlay .tour-title { font-size: 14px; font-weight: 700; color: #2563eb; margin-bottom: 4px; }
  #tour-overlay .tour-desc { font-size: 12.5px; color: #334155; margin-bottom: 12px; line-height: 1.5; }
  #tour-overlay .tour-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #tour-overlay .tour-btn-primary { background: #2563eb; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  #tour-overlay .tour-btn-primary:hover { background: #1d4ed8; }
  #tour-overlay .tour-btn-secondary { background: transparent; color: #64748b; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #tour-overlay .tour-btn-secondary:hover { background: #f1f5f9; }
  #tour-overlay .tour-skip-btn { position: fixed; top: 20px; right: 20px; background: rgba(255,255,255,0.95); color: #0f172a; padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 1003; }
  #tour-trigger { font-weight: 600; }
  @keyframes guide-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
    100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
  }
  #tour-trigger.attention { animation: guide-pulse 1.6s ease-out infinite; border-color: #fbbf24; color: #fbbf24; }
  body.light-mode #tour-trigger.attention { border-color: #d97706; color: #d97706; }
  table.timeline thead tr th:first-child { border-top-left-radius: 12px; }
  table.timeline td.info-col {
    padding: 0 10px; font-size: 14px; border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--bg-elevated);
  }
  .sticky-pri  { position: sticky; left: 0;    z-index: 5; }
  .sticky-task { position: sticky; left: 42px; z-index: 5; }
  .task-row:hover .sticky-pri,
  .task-row:hover .sticky-task { z-index: 10; }
  td.task-name-cell {
    white-space: normal; min-width: 160px;
    overflow-wrap: break-word; line-height: 1.35;
    display: table-cell; vertical-align: middle;
  }
  td.task-name-cell .task-name-wrap {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; max-width: 260px; word-break: break-word;
  }
  /* On hover, drop the 2-line clamp so the full task name renders in place
     (mirrors the status dot / bar expand pattern — no separate tooltip).
     white-space: normal is required because `table.timeline td.info-col`
     wins specificity over `td.task-name-cell`'s `white-space: normal`, so
     without this override the unclamped text would render as a single
     nowrap line and bleed into the date columns. */
  td.task-name-cell:hover .task-name-wrap {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    white-space: normal;
  }
  /* Jira key badge — hidden by default, revealed on task name hover (same
     trigger as the name expand-in-place). Sibling of .task-name-wrap so the
     2-line clamp on the name doesn't hide it. */
  .task-jira-key {
    display: none;
    margin-bottom: 4px;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    width: fit-content;
  }
  td.task-name-cell:hover .task-jira-key { display: inline-block; }

  th.gantt-col { padding: 0; border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 4; border-top-right-radius: 12px; }
  td.gantt-col { padding: 0; border-bottom: 1px solid var(--border); position: relative; height: 38px; background: var(--bg-elevated); }

  .team-header td {
    padding: 6px 10px !important; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--bg-elevated) !important; border-bottom: 1px solid var(--border) !important;
  }
  /* Freeze the team-header info td on horizontal scroll — same idea as the
     sticky Priority / Task cells, but covering the whole row-spanning meta
     band so the team name + Lead/PM/PMO stay visible when the user scrolls
     deep into the Gantt area. */
  .team-header td.info-col {
    position: sticky;
    left: 0;
    z-index: 4;
  }
  /* Team header inline meta — Lead/PM relocated 2026-05-07 (was per-task columns) */
  .team-header .team-count {
    font-weight: 400; font-size: 11px; opacity: 0.6;
  }
  .team-header .team-people {
    font-weight: 400; font-size: 11px;
    color: var(--text-secondary);
    text-transform: none; letter-spacing: normal;
  }
  .team-header .team-people .role { color: var(--text-muted); }

  .task-row:hover td.info-col { background: #222a3d; }
  .task-row:hover td.gantt-col { background: #222a3d; }

  .task-name-cell { font-weight: 500; }
  .task-name-cell a { color: var(--text-primary); text-decoration: none; }
  .task-name-cell a:hover { color: #a5b4fc; }

  /* ── Soft badges ── */
  .priority-badge {
    display: inline-block; padding: 3px 7px; border-radius: 5px;
    font-size: 11px; font-weight: 600; min-width: 28px; text-align: center;
    text-transform: uppercase; letter-spacing: 0.04em;
    border: 1px solid transparent;
  }
  .pri-P0 { color: var(--red);   background: var(--red-bg);   border-color: rgba(244,112,103,0.2); }
  .pri-P1 { color: var(--amber); background: var(--amber-bg); border-color: rgba(229,164,75,0.2); }
  .pri-P2 { color: var(--blue);  background: var(--blue-bg);  border-color: rgba(91,138,245,0.2); }
  .pri-Low, .pri-default { color: var(--text-muted); background: rgba(255,255,255,0.04); border-color: var(--border); }

  .risk-badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 700; line-height: 1.4;
    border: 1px solid transparent; min-width: 18px; text-align: center;
    transition: padding 0.12s ease;
    cursor: default;
  }

  /* Status dot — small colored circle that expands to a pill on hover. */
  .status-dot {
    position: absolute;
    left: 6px; top: 50%;
    transform: translateY(-50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    z-index: 2;
    cursor: default;
    display: inline-flex; align-items: center;
    overflow: hidden; white-space: nowrap;
    transition: width 0.12s ease, height 0.12s ease, border-radius 0.12s ease;
  }
  .status-dot .status-text {
    font-size: 10px; font-weight: 600; color: #fff;
    padding: 0 8px;
    opacity: 0;
    transition: opacity 0.1s ease 0.04s;
  }
  .status-dot:hover {
    width: auto; height: 16px;
    border-radius: 8px;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .status-dot:hover .status-text { opacity: 1; }
  .risk-badge .risk-word { display: none; }
  .risk-badge:hover .risk-letter { display: none; }
  .risk-badge:hover .risk-word { display: inline; }
  .risk-badge:hover { padding: 2px 9px; }
  .risk-Low    { color: var(--green); background: var(--green-bg); border-color: rgba(76,175,130,0.25); }
  .risk-Medium { color: var(--amber); background: var(--amber-bg); border-color: rgba(229,164,75,0.25); }
  .risk-High   { color: var(--red);   background: var(--red-bg);   border-color: rgba(244,112,103,0.25); }
  .risk-none   { color: var(--text-muted); }

  /* T-shirt size — blue color family (distinct from Risk's red/amber/green
     warning palette so the two never visually collide). Darker shade = bigger. */
  .tshirt-badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 11px; font-weight: 700; line-height: 1.4;
    border: 1px solid transparent; min-width: 18px; text-align: center;
    transition: padding 0.12s ease;
    cursor: default;
  }
  .tshirt-badge .tshirt-word { display: none; }
  .tshirt-badge:hover .tshirt-letter { display: none; }
  .tshirt-badge:hover .tshirt-word { display: inline; }
  .tshirt-badge:hover { padding: 2px 9px; }
  .tshirt-S  { color: #93c5fd; background: rgba(147,197,253,0.08); border-color: rgba(147,197,253,0.25); }
  .tshirt-M  { color: #60a5fa; background: rgba(96,165,250,0.12);  border-color: rgba(96,165,250,0.30); }
  .tshirt-L  { color: #3b82f6; background: rgba(59,130,246,0.16);  border-color: rgba(59,130,246,0.35); }
  .tshirt-XL { color: #2563eb; background: rgba(37,99,235,0.20);   border-color: rgba(37,99,235,0.40); }
  .tshirt-none { color: var(--text-muted); }
  body.light-mode .tshirt-S  { color: #2563eb; }
  body.light-mode .tshirt-M  { color: #1d4ed8; }
  body.light-mode .tshirt-L  { color: #1e40af; }
  body.light-mode .tshirt-XL { color: #1e3a8a; }

  .date-cell { color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .at-risk td.info-col { background: rgba(244,112,103,0.04) !important; }
  .at-risk .task-name-cell a, .at-risk .task-name-cell { color: var(--red); }

  .prd-badge {
    display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px;
    font-weight: 600; vertical-align: middle; border: 1px solid transparent;
  }
  /* Click target for the PRD badge — only wraps when t.prdUrl exists. The
     <a> sits in line with the badge and does not change its size/position. */
  a.prd-badge-link {
    text-decoration: none; cursor: pointer; display: inline-block;
    transition: filter 0.1s ease;
  }
  a.prd-badge-link:hover { filter: brightness(1.15); }
  .schedule-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
  .schedule-behind     { color: var(--red);   background: var(--red-bg);   border-color: rgba(244,112,103,0.2); }
  .schedule-late-start { color: var(--amber); background: var(--amber-bg); border-color: rgba(229,164,75,0.25); }
  .schedule-on-track   { color: var(--green); background: var(--green-bg); border-color: rgba(76,175,130,0.2); }
  .schedule-ahead      { color: var(--blue);  background: var(--blue-bg);  border-color: rgba(91,138,245,0.2); }
  .schedule-done       { color: var(--text-muted); background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); }

  .prd-missing { color: var(--amber); background: var(--amber-bg); border-color: rgba(229,164,75,0.2); }
  .prd-draft   { color: var(--amber); background: var(--amber-bg); border-color: rgba(229,164,75,0.2); opacity: 0.75; }
  .prd-review  { color: var(--blue);  background: var(--blue-bg);  border-color: rgba(91,138,245,0.2); }
  .prd-done    { color: var(--green); background: var(--green-bg); border-color: rgba(76,175,130,0.2); }
  .prd-todo    { color: #64748b; background: #f1f5f9; border-color: rgba(100,116,139,0.2); }

  /* ── Gantt internals ── */
  .gantt-area { position: relative; height: 100%; min-height: 38px; background: inherit; }
  .gantt-bar {
    position: absolute; height: 10px; border-radius: 10px;
    top: 50%; transform: translateY(-50%); opacity: 0.8; min-width: 4px; z-index: 2;
    background-color: var(--c);
  }
  .task-row:hover .gantt-bar { opacity: 1; }

  /* Dual-bar Gantt — half-height plan (top) + actual (bottom) + overrun.
     Only used when effective actual data exists; To Do tasks keep .gantt-bar. */
  .gantt-plan {
    position: absolute; top: 50%; height: 6px;
    background: rgba(148,163,184,0.55);
    transform: translateY(-100%);
    border-top-left-radius: 6px; border-top-right-radius: 6px;
    z-index: 1; min-width: 3px;
  }
  .gantt-actual {
    position: absolute; top: 50%; height: 6px;
    border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
    opacity: 0.92; z-index: 2; min-width: 3px;
    background-color: var(--c);
  }
  /* In Progress + no actualEnd: fade right edge to suggest "ongoing".
     Implemented as a bg gradient (not mask-image) so the .bar-label child
     stays fully solid — masking the whole element also masked the label. */
  .gantt-actual.in-progress-ongoing {
    background-color: transparent;
    background-image: linear-gradient(90deg, var(--c) 70%, transparent 100%);
  }
  .gantt-overrun {
    position: absolute; top: 50%; height: 6px;
    background-image: repeating-linear-gradient(45deg,
      rgba(244,112,103,0.55), rgba(244,112,103,0.55) 4px,
      rgba(244,112,103,0.20) 4px, rgba(244,112,103,0.20) 8px);
    border-bottom-right-radius: 6px;
    z-index: 3; min-width: 3px;
  }
  .task-row:hover .gantt-plan,
  .task-row:hover .gantt-actual,
  .task-row:hover .gantt-overrun { opacity: 1; }

  /* Multi-scenario stacked lanes (when 2+ scenarios selected). Each bar
     grows on hover to reveal an inline label (same pattern as single
     mode). Actual lane uses a distinct slate color so it never blends
     into the team-coloured scenario bars. Letter badges (O/R/P/A) sit
     at the left edge of each bar for always-visible identification. */
  .gantt-multi {
    position: absolute; border-radius: 4px;
    min-width: 3px; z-index: 2;
    background-color: var(--c);
    display: flex; align-items: center; justify-content: flex-start;
    white-space: nowrap;
    transition: height 0.12s ease, filter 0.12s ease;
  }
  .gantt-multi:hover { height: 13px; z-index: 10; filter: brightness(1.12); }
  .gantt-multi.scen-optimistic { top: 4px;  height: 5px; opacity: 0.6; }
  .gantt-multi.scen-realistic  { top: 11px; height: 5px; opacity: 0.95; }
  .gantt-multi.scen-pessimist  { top: 18px; height: 5px; opacity: 0.6; }
  .gantt-multi.scen-actual {
    top: 26px; height: 7px; opacity: 1;
    background-color: #475569;  /* slate-600 — distinct from any team color */
  }
  body.light-mode .gantt-multi.scen-actual { background-color: #64748b; }

  /* Hover-visible inline labels (scenario name + date range) */
  .gantt-multi > .bar-label { padding: 1px 5px; background-color: var(--c); }
  .gantt-multi.scen-actual > .bar-label { background-color: #475569; }
  body.light-mode .gantt-multi.scen-actual > .bar-label { background-color: #64748b; }
  .gantt-multi:hover .bar-label { opacity: 1; }

  /* Overrun (Late) bars are clickable — open the Add Late Reason modal */
  .gantt-overrun { cursor: pointer; }
  .gantt-overrun:hover { z-index: 11; }

  /* Late tooltip — shows on overrun bar hover (date + posted reasons) */
  .late-tooltip {
    position: fixed; display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-mid);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    z-index: 80;
    min-width: 220px; max-width: 360px;
    font-size: 12px; color: var(--text-secondary);
    pointer-events: none;
  }
  .late-tooltip.show { display: block; }
  .late-tooltip-date {
    color: var(--red); font-weight: 700;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .late-tooltip-comments {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 240px; overflow-y: auto;
    margin-bottom: 8px;
  }
  .late-tooltip-comment {
    background: var(--bg-elevated);
    border-radius: 6px;
    padding: 6px 8px;
    line-height: 1.4;
  }
  .late-tooltip-comment-meta {
    font-size: 10px; color: var(--text-muted);
    margin-bottom: 2px;
  }
  .late-tooltip-comment-body {
    color: var(--text-primary);
    word-break: break-word;
  }
  .late-tooltip-empty {
    color: var(--text-muted); font-style: italic;
    padding: 4px 0 8px;
  }
  .late-tooltip-hint {
    font-size: 11px; color: var(--text-muted);
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    font-style: italic;
  }

  /* Late reason modal */
  .late-reason-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
  }
  .late-reason-overlay.show { display: flex; }
  .late-reason-modal {
    background: var(--bg-card);
    border: 1px solid var(--border-mid);
    border-radius: 12px;
    padding: 22px 24px 18px;
    width: 460px; max-width: 90vw;
    box-shadow: 0 14px 48px rgba(0, 0, 0, 0.45);
  }
  .late-reason-title {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 3px;
  }
  .late-reason-subtitle {
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .late-reason-label {
    display: block; font-size: 10px; font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .late-reason-modal input,
  .late-reason-modal textarea {
    width: 100%; padding: 8px 11px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 6px;
    font-family: inherit; font-size: 13px;
    margin-bottom: 12px;
    box-sizing: border-box;
    outline: none;
    resize: vertical;
    transition: border-color 0.12s ease;
  }
  .late-reason-modal input:focus,
  .late-reason-modal textarea:focus { border-color: var(--blue); }
  .late-reason-status {
    font-size: 12px; min-height: 18px;
    margin-bottom: 8px;
  }
  .late-reason-status.error { color: var(--red); }
  .late-reason-status.info  { color: var(--text-secondary); }
  .late-reason-status.ok    { color: var(--green); }
  .late-reason-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .late-reason-btn-primary,
  .late-reason-btn-cancel {
    padding: 7px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    border: 1px solid transparent;
    transition: filter 0.12s ease, border-color 0.12s ease;
  }
  .late-reason-btn-primary { background: var(--blue); color: white; }
  .late-reason-btn-primary:hover { filter: brightness(1.1); }
  .late-reason-btn-primary:disabled { opacity: 0.5; cursor: wait; }
  .late-reason-btn-cancel {
    background: transparent; color: var(--text-secondary);
    border-color: var(--border-mid);
  }
  .late-reason-btn-cancel:hover { color: var(--text-primary); border-color: var(--text-muted); }

  /* Toast notifications (bottom-right stack) */
  .toast-container {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 200;
    display: flex; flex-direction: column-reverse;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    min-width: 220px; max-width: 380px;
    pointer-events: auto;
    animation: toast-in 0.18s ease-out;
  }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error   { border-left: 3px solid var(--red); }
  @keyframes toast-in {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  /* Always-on letter badges at the left of each bar */
  .gantt-lane-badge {
    position: absolute; z-index: 11;
    font-size: 9px; font-weight: 800; line-height: 1;
    padding: 1px 4px; border-radius: 3px;
    background: rgba(15,23,42,0.85); color: #fff;
    letter-spacing: 0.04em;
    pointer-events: none;
    transform: translateX(-100%);
    margin-left: -3px;
  }
  .gantt-lane-badge.lane-optimistic { top: 2px;  }
  .gantt-lane-badge.lane-realistic  { top: 9px;  }
  .gantt-lane-badge.lane-pessimist  { top: 16px; }
  .gantt-lane-badge.lane-actual     { top: 24px; background: #f59e0b; }
  body.light-mode .gantt-lane-badge { background: rgba(15,23,42,0.8); }

  /* Bar hover — segment grows in height and reveals date label inside.
     Mirrors the status-dot expand pattern: same colour, just thicker, with
     text fading in inside the bar. Label is allowed to overflow the bar
     width so narrow bars still show the full date string; strong text
     shadow keeps it legible against the row background. */
  .gantt-bar, .gantt-plan, .gantt-actual, .gantt-overrun {
    display: flex; align-items: center; justify-content: flex-start;
    white-space: nowrap;
    transition: height 0.12s ease;
  }
  .bar-label {
    font-size: 10px; font-weight: 700; color: #fff;
    padding: 2px 6px; line-height: 1;
    border-radius: 3px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.1s ease 0.04s;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  /* Backdrop = same colour family as the bar — label reads as an extension of
     the bar, not a foreign chip stuck next to it. Inline `background:<team>`
     on .gantt-bar / .gantt-actual is inherited by the child label. Plan and
     overrun pick their own solid colour since plan's bg is translucent grey
     and overrun's is a hatch gradient. */
  .gantt-bar > .bar-label,
  .gantt-actual > .bar-label { background-color: var(--c); }
  .gantt-overrun > .bar-label { background-color: var(--red); }
  /* Plan label: no chip — text sits directly on the plan bar. Theme-adaptive
     colour + halo text-shadow keep it legible on the bar AND in the bit that
     overflows onto the row background. Any solid backdrop here read as a
     darker chip than the bar's translucent grey. */
  .gantt-plan > .bar-label {
    background-color: transparent;
    color: #f1f5f9;
    text-shadow: 0 0 3px rgba(15,23,42,0.95), 0 0 6px rgba(15,23,42,0.6);
    padding: 0 4px;
  }
  body.light-mode .gantt-plan > .bar-label {
    color: #0f172a;
    text-shadow: 0 0 3px rgba(255,255,255,0.95), 0 0 6px rgba(255,255,255,0.7);
  }
  .gantt-bar:hover { height: 18px; z-index: 10; }
  .gantt-plan:hover, .gantt-actual:hover, .gantt-overrun:hover { height: 16px; z-index: 10; }
  /* No alpha bump on plan:hover anymore — the label is transparent + shadowed,
     so the bar can stay its natural translucent grey when hovered. */
  .gantt-overrun:hover {
    background-image: none;
    background-color: rgba(244,112,103,0.85);
  }
  .gantt-bar:hover .bar-label,
  .gantt-plan:hover .bar-label,
  .gantt-actual:hover .bar-label,
  .gantt-overrun:hover .bar-label { opacity: 1; }
  .ideal-diamond {
    position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(45deg);
    width: 8px; height: 8px; background: var(--amber); border: 1px solid rgba(229,164,75,0.5); z-index: 3;
  }

  .gantt-header-wrap { position: relative; }
  .gantt-months-row { display: flex; border-bottom: 1px solid var(--border); }
  .gantt-month-label {
    text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.07em; padding: 7px 0;
    border-right: 1px solid var(--border);
  }
  .gantt-weeks-row { display: flex; }
  .gantt-week-label {
    text-align: center; font-size: 10px; color: var(--text-muted);
    padding: 4px 0; border-right: 1px solid var(--border);
  }
  .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; }
  .today-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--red); z-index: 1; opacity: 0.5; }

  /* ── Tooltip ── */
  .tooltip {
    display: none; position: fixed; background: #1a2035; border: 1px solid var(--border-mid);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; z-index: 100; max-width: 300px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6); pointer-events: none;
  }
  .tooltip.show { display: block; }
  .tt-title { font-weight: 600; margin-bottom: 7px; color: var(--text-primary); font-size: 12px; letter-spacing: -0.01em; }
  .tt-section { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 7px 0 3px; font-weight: 600; }
  .tt-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .tt-label { color: var(--text-muted); }
  .tt-value { color: var(--text-secondary); font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .tt-link { color: #a5b4fc; text-decoration: none; border-bottom: 1px solid rgba(165,180,252,0.3); }

  /* ── Theme toggle button ── */
  .theme-btn {
    padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border-mid);
    background: transparent; color: var(--text-secondary); font-size: 13px;
    cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .theme-btn:hover { border-color: rgba(255,255,255,0.22); color: var(--text-primary); }
  .theme-btn:disabled { opacity: 0.5; cursor: wait; }

  /* ── Scenario toggle (Optimistic / Realistic / Pessimist) ── */
  .scenario-toggle {
    display: inline-flex; padding: 2px; gap: 1px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    flex-shrink: 0;
  }
  .scenario-toggle button {
    border: none; background: transparent;
    color: var(--text-muted); font-size: 11px; font-weight: 600;
    padding: 5px 11px; cursor: pointer; border-radius: 6px;
    font-family: inherit; letter-spacing: 0.01em;
    transition: background 0.15s, color 0.15s;
  }
  .scenario-toggle button:hover { color: var(--text-primary); }
  .scenario-toggle button.active {
    background: var(--bg-elevated); color: var(--text-primary);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }
  body.light-mode .scenario-toggle {
    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(0, 0, 0, 0.06);
  }
  body.light-mode .scenario-toggle button.active {
    background: white; color: #1e293b;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  /* ── Export dropdown ── */
  .export-wrap { position: relative; display: inline-block; }
  .export-menu {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 4px;
    background: var(--bg-card); border: 1px solid var(--border-mid);
    border-radius: 8px; padding: 4px; z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35); min-width: 150px;
  }
  .export-menu button {
    display: block; width: 100%; text-align: left;
    padding: 8px 12px; border: none; background: none;
    color: var(--text-secondary); font-size: 13px;
    cursor: pointer; border-radius: 6px; font-family: inherit; font-weight: 500;
  }
  .export-menu button:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* ── Grid lines (theme-aware) ── */
  .grid-line-minor { background: rgba(255,255,255,0.04); }
  .grid-line-major { background: rgba(255,255,255,0.16); }

  /* ── Collapsible columns ── */
  th[data-col] { cursor: pointer; user-select: none; }
  th[data-col]:hover { color: var(--text-primary); }
  [data-col].col-hidden {
    width: 10px !important; min-width: 10px !important; max-width: 10px !important;
    padding: 0 !important; overflow: hidden;
  }
  th[data-col].col-hidden {
    background: var(--bg-elevated) !important;
    border-right: 1px solid var(--border);
  }
  body.light-mode th[data-col].col-hidden { background: var(--bg-card) !important; }

  /* ── Column header info tooltip ── */
  .col-info {
    display: inline-block; width: 13px; height: 13px; line-height: 12px;
    font-size: 9px; text-align: center; border-radius: 50%;
    background: var(--bg-hover); border: 1px solid var(--border-mid);
    color: var(--text-muted); cursor: default; margin-left: 4px;
    vertical-align: middle; position: relative; font-weight: 400;
    text-transform: none; letter-spacing: 0;
  }
  .col-info:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Light mode ── */
  body.light-mode {
    --bg-main:        #dfe3f0;
    --bg-card:        #ffffff;
    --bg-elevated:    #eceef7;
    --bg-hover:       rgba(0,0,0,0.03);
    --border:         rgba(0,0,0,0.09);
    --border-mid:     rgba(0,0,0,0.15);
    --text-primary:   #1e2d4a;
    --text-secondary: #5c6e8a;
    --text-muted:     #90a0bb;
  }
  body.light-mode table.timeline td.info-col { background: var(--bg-card); }
  body.light-mode td.gantt-col { background: var(--bg-card); }
  body.light-mode .team-header td { background: var(--bg-card) !important; border-bottom: 1px solid var(--border) !important; }
  body.light-mode .task-row:hover td.info-col { background: #dde1f0; }
  body.light-mode .task-row:hover td.gantt-col { background: #dde1f0; }
  body.light-mode .timeline-container { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  body.light-mode .summary-card {
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  body.light-mode .summary-card:hover {
    border-color: rgba(229, 164, 75, 0.45);
    box-shadow: 0 3px 10px rgba(229, 164, 75, 0.12);
  }
  body.light-mode .prd-pm-card { box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06); }
  body.light-mode .prd-pm-card:hover {
    border-color: rgba(229, 164, 75, 0.45);
    box-shadow: 0 3px 10px rgba(229, 164, 75, 0.12);
  }
  body.light-mode .strip-pill:hover { box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08); }
  body.light-mode .theme-btn:hover { border-color: rgba(0,0,0,0.25); }
  body.light-mode .export-menu { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  body.light-mode .grid-line-minor { background: rgba(0,0,0,0.05); }
  body.light-mode .grid-line-major { background: rgba(0,0,0,0.18); }
  body.light-mode .pri-Low,
  body.light-mode .pri-default { background: rgba(0,0,0,0.06); }
  body.light-mode .task-jira-key { background: rgba(0,0,0,0.05); }
  body.light-mode .task-name-cell a:hover { color: var(--accent); }
  body.light-mode .filter-btn.active { color: var(--accent); }
  body.light-mode .at-risk td.info-col { background: rgba(244,112,103,0.06) !important; }
  body.light-mode .prd-alert {
    background: rgba(234,88,12,0.07);
    border-color: rgba(234,88,12,0.3);
    border-left-color: #ea580c;
  }
  body.light-mode .prd-alert-title { color: #c2410c; }
  body.light-mode .prd-alert-items { color: #92400e; opacity: 1; }
  body.light-mode .prd-pm-name { color: #1e293b; }
  body.light-mode .prd-pm-items { color: #475569; }
  body.light-mode .prd-pm-count {
    background: rgba(0, 0, 0, 0.05);
    color: #64748b;
  }
  .footer-credit {
    margin: 24px 0 16px; padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
    text-align: left;
  }
  .footer-credit a {
    color: var(--text-secondary); text-decoration: none;
    border-bottom: 1px dotted rgba(148, 163, 184, 0.4);
  }
  .footer-credit a:hover { border-bottom-color: var(--text-muted); }
</style>

<body>
<div id="scroll-wrap">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
  <div>
    <h1 style="margin-bottom:3px">ESL - Project Timeline</h1>
    <p class="subtitle" style="margin-bottom:0;font-size:12px;opacity:0.7">Gantt chart view &middot; data live from Google Sheets &amp; Notion</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="export-wrap" id="export-wrap">
      <button class="theme-btn" id="export-btn" onclick="toggleExportMenu()">Export &#9662;</button>
      <div class="export-menu" id="export-menu">
        <button onclick="exportTimeline('png')">&#128247; Download PNG</button>
        <button onclick="exportTimeline('pdf')">&#128196; Download PDF</button>
      </div>
    </div>
    <button class="theme-btn" id="tour-trigger" onclick="runTour()" title="Show what's new">Guide</button>
    <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">Light Mode</button>
  </div>
</div>

<div id="root">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div>Loading data from Google Sheets...</div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const TEAM_COLORS = {
  CALL:'#3b82f6', SDK:'#8b5cf6', CHAT:'#10b981',
  API:'#f97316', Email:'#06b6d4', AGX:'#ec4899', DATA:'#a3e635',
};
const TEAM_ORDER = ['CALL','SDK','CHAT','API','Email','AGX','DATA'];

const TIMELINE_START = new Date('2026-04-01');
const TIMELINE_END   = new Date('2026-10-31');
const DAY_MS    = 86400000;
const totalDays = Math.round((TIMELINE_END - TIMELINE_START) / DAY_MS);
const GANTT_W   = 1200;

function hexAlpha(hex, a) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + 'T12:00:00');
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function dayOffset(d) { return (d - TIMELINE_START) / DAY_MS; }
function dayToPx(day) { return (day / totalDays) * GANTT_W; }
function fmtShort(d)  { return d ? (d.getMonth()+1) + '/' + d.getDate() : '-'; }
function fmtFull(d)   { return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '-'; }
function compareDate(a, b) {
  if (!a && !b) return 0;
  if (!a) return 1;
  if (!b) return -1;
  return new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00');
}

let ALL_TASKS = [];
let activeTeam    = 'ALL';
let hiddenCols    = new Set();
let activePM      = 'ALL';
let activeStatus   = 'ALL';
let activeSchedule = 'ALL';
let searchQuery   = '';
let showDeps      = false;
let showActual    = false; // toggled via "Show Actual" button; persisted in localStorage
let activeSort    = 'start'; // 'default' | 'start' | 'end' | 'ideal' — default sorts tasks by plan start within each team
let flatView      = false;
let lastUpdatedAt = '';
// Multi-select scenario selection. At least 1 must always be selected.
// When >1 selected, the Gantt renders stacked sub-bars (one per scenario).
// When exactly 1 selected, behaves like the original single-scenario view
// (plan + actual split, overrun hatching, etc. — all richer rendering).
//
// Each page load starts with ONLY Realistic selected (no localStorage
// restore). Users can toggle into multi-select per session, but a fresh
// load is always single-scenario Realistic.
let selectedScenarios = ['realistic'];

// Clear any legacy localStorage keys so they don't accidentally re-hydrate later.
try { localStorage.removeItem('esl-scenarios'); } catch (e) {}
try { localStorage.removeItem('esl-scenario');  } catch (e) {}

function saveScenarios() {
  // No-op — selection is intentionally not persisted (see comment above).
}

// "Primary" scenario drives non-Gantt computations: Schedule badge, Past Ideal
// Date count, at-risk hatching, etc. When multiple are selected, prefer
// Realistic; otherwise fall back to whichever single one is selected.
function primaryScenario() {
  if (selectedScenarios.indexOf('realistic') >= 0) return 'realistic';
  return selectedScenarios[0] || 'realistic';
}

// Apply the primary scenario's dates onto each task's t.start / t.end /
// t.scenarioEffort. Multi-select mode also reads t.optimistic / t.realistic /
// t.pessimist directly during Gantt rendering to draw the additional sub-bars.
function applyScenarios() {
  var primary = primaryScenario();
  ALL_TASKS.forEach(function(t) {
    var s = t[primary] || t.realistic || {};
    t.start          = s.start  || '';
    t.end            = s.end    || '';
    t.scenarioEffort = s.effort || 0;
  });
}

function toggleScenario(scenario) {
  var idx = selectedScenarios.indexOf(scenario);
  if (idx >= 0) {
    if (selectedScenarios.length === 1) return;  // can't deselect the last one
    selectedScenarios.splice(idx, 1);
  } else {
    selectedScenarios.push(scenario);
  }
  saveScenarios();
  applyScenarios();
  renderAll(null);
}

function loadData() {
  try {
    const json = <?!= timelineData ?>;
    ALL_TASKS = json.tasks || [];
    applyScenarios();
    // Scenario toggle is built inside renderControls() (ctrlRow2) and wires
    // its own click handlers on creation — nothing to wire here.
    renderAll(json.updatedAt);
  } catch (e) {
    document.getElementById('root').innerHTML =
      '<div class="error-box">Error: ' + e.message + '</div>';
  }
}

function renderAll(updatedAt) {

  const root = document.getElementById('root');

  root.appendChild(buildSummary());
  root.appendChild(buildPrdAlert());

  // ── Legend + timestamp on one compact line ──

    const ts = document.createElement('span');
    ts.style.cssText = 'font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;';
    ts.textContent = 'Updated: ' + new Date(lastUpdatedAt).toLocaleString();

  // ── Team filter ──
  root.appendChild(buildFilterGroup('Team', ['ALL'].concat(TEAM_ORDER), activeTeam, function(v) { activeTeam = v; renderTimeline(); }));

  const ctrlRow = document.createElement('div');
  ctrlRow.className = 'filter-group';
  ctrlRow.style.marginBottom = '14px';

  const pms = getPMList();

      'background:var(--bg-card);color:var(--text-secondary);font-size:13px;font-family:inherit;cursor:pointer;outline:none;';
    ['ALL'].concat(pms).forEach(function(p) {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p === 'ALL' ? 'All PMs' : p;
      if (p === activePM) opt.selected = true;
      pmSel.appendChild(opt);
    });
    pmSel.onchange = function() { activePM = pmSel.value; renderTimeline(); };
    ctrlRow.appendChild(pmLbl);
    ctrlRow.appendChild(pmSel);

    const sep = document.createElement('span');
    sep.style.cssText = 'display:inline-block;width:1px;height:16px;background:var(--border-mid);margin:0 6px;align-self:center;';
    ctrlRow.appendChild(sep);
  }

  const depsLbl = document.createElement('span');
  depsLbl.className = 'filter-label';
  depsLbl.textContent = 'Deps';
  const depsBtn = document.createElement('button');
  depsBtn.id = 'dep-toggle';
  depsBtn.className = 'filter-btn' + (showDeps ? ' active' : '');
  depsBtn.textContent = 'Show Dependencies';
  depsBtn.onclick = toggleDeps;
  ctrlRow.appendChild(depsLbl);
  ctrlRow.appendChild(depsBtn);

  const actLbl = document.createElement('span');
  actLbl.className = 'filter-label';
  actLbl.textContent = 'Actual';
  const actBtn = document.createElement('button');
  actBtn.id = 'actual-toggle';
  actBtn.className = 'filter-btn' + (showActual ? ' active' : '');
  actBtn.textContent = 'Show Actual';
  actBtn.onclick = toggleShowActual;
  ctrlRow.appendChild(actLbl);
  ctrlRow.appendChild(actBtn);

  // ── Sort controls ──
  var sortSep = document.createElement('span');
  sortSep.style.cssText = 'display:inline-block;width:1px;height:16px;background:var(--border-mid);margin:0 6px;align-self:center;';
  ctrlRow.appendChild(sortSep);
  var sortLbl = document.createElement('span');
  sortLbl.className = 'filter-label';
  sortLbl.textContent = 'Sort';
  ctrlRow.appendChild(sortLbl);
  var sortOpts = [{v:'default',l:'Default'},{v:'start',l:'Plan Start'},{v:'end',l:'Plan End'},{v:'ideal',l:'Ideal Date'}];
  sortOpts.forEach(function(s) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeSort === s.v ? ' active' : '');
    btn.textContent = s.l;
    btn.onclick = function() { activeSort = s.v; if (s.v === 'default') flatView = false; renderAll(null); };
    ctrlRow.appendChild(btn);
  });

  // ── Grouped / Flat toggle (visible when sort is active) ──
  if (activeSort !== 'default') {
    var viewSep = document.createElement('span');
    viewSep.style.cssText = 'display:inline-block;width:1px;height:16px;background:var(--border-mid);margin:0 6px;align-self:center;';
    ctrlRow.appendChild(viewSep);
    var viewLbl = document.createElement('span');
    viewLbl.className = 'filter-label';

    ctrlRow.appendChild(viewLbl);
    [{v:false,l:'Grouped'},{v:true,l:'Flat'}].forEach(function(opt) {

  ctrlRow2.appendChild(searchInput);

  // Separator
  var scenSep = document.createElement('span');
  scenSep.style.cssText = 'display:inline-block;width:1px;height:16px;background:var(--border-mid);margin:0 10px;align-self:center;';
  ctrlRow2.appendChild(scenSep);

  // Scenario toggle (multi-select)

  scenWrap.title = 'Click to toggle each scenario. Select multiple to compare side-by-side on the Gantt.';
  [{v:'optimistic',l:'Optimistic'},{v:'realistic',l:'Realistic'},{v:'pessimist',l:'Pessimist'}].forEach(function(opt) {
    var b = document.createElement('button');
    b.dataset.scenario = opt.v;
    b.textContent = opt.l;

  });
  ctrlRow2.appendChild(scenWrap);

  root.appendChild(ctrlRow2);

  const wrap = document.createElement('div');
  wrap.id = 'timeline-wrap';
  root.appendChild(wrap);
  renderTimeline();
