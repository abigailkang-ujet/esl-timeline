const TEAM_ALIASES = {
  'agent experience': 'AGX',
  'admin experience': 'ADX',
  'agx':             'AGX',
  'calls':           'CALL',
  'call':            'CALL',
  'web':             'SDK',
  'data platforms':  'DATA',
  'api':             'API',
};

function getTeamKey(tm) {
  if (!tm) return 'Other';
  var lower = tm.trim().toLowerCase();
  if (TEAM_ALIASES[lower]) return TEAM_ALIASES[lower];
  var matched = TEAM_ORDER.find(function(o) { return o.toLowerCase() === lower; });
  return matched || tm;
}

function toggleCol(col) {
  if (hiddenCols.has(col)) hiddenCols.delete(col);
  else hiddenCols.add(col);
  applyHiddenCols();
}

function applyHiddenCols() {
  document.querySelectorAll('[data-col]').forEach(function(el) {
    var col = el.getAttribute('data-col');
    el.classList.toggle('col-hidden', hiddenCols.has(col));
    if (el.tagName === 'TH') {
      el.title = hiddenCols.has(col) ? 'Click to show' : 'Click to hide';
    }
  });
}

function attachColToggle() {
  document.querySelectorAll('th[data-col]').forEach(function(th) {
    var col = th.getAttribute('data-col');
    if (col === 'actStart' || col === 'actEnd') return; // controlled by Show Actual toggle, not individual click-to-hide
    th.addEventListener('click', function(e) {
      if (e.target.closest('.col-info')) return;
      toggleCol(col);
    });
  });
}

function renderTimeline() {
  const wrap = document.getElementById('timeline-wrap');
  if (!wrap) return;
  const sq = searchQuery.trim().toLowerCase();
  const filtered = ALL_TASKS.filter(function(t) {
    return (activeTeam     === 'ALL' || getTeamKey(t.team) === activeTeam) &&
           (activePM       === 'ALL' || matchesPM(t.pm, activePM)) &&
           (activeStatus   === 'ALL' || t.status === activeStatus) &&
           (activeSchedule === 'ALL' || getScheduleStatus(t) === activeSchedule) &&
           (!sq || (t.task||'').toLowerCase().includes(sq) || (t.epic||'').toLowerCase().includes(sq));
  });
  wrap.innerHTML = '';
  wrap.appendChild(buildTimeline(filtered, activeTeam));
  attachColToggle();
  applyHiddenCols();
  if (showDeps) drawDependencies();
}

function statusColor(s) {
  var l = s.toLowerCase();
  if (l === 'in progress')                          return 'var(--blue)';
  if (l === 'closed' || l === 'done' || l === 'complete') return 'var(--green)';
  if (l === 'blocked')                              return 'var(--red)';
  if (l === 'untriaged')                            return 'var(--amber)';
  return '#94a3b8';
}

function buildSummary() {
  const tasks = ALL_TASKS.filter(function(t) { return t.start && t.end; });
  const atRisk = tasks.filter(function(t) {
    const e = parseDate(t.end), i = parseDate(t.ideal);
    return e && i && e > i;
  }).length;
  const wrap = document.createElement('div');

  // ── Row 1: 요약 카드 (progress X/Y format) ──
  const tasksDone = ALL_TASKS.filter(isClosed).length;
  const tasksTotal = ALL_TASKS.length;

  const p0All = ALL_TASKS.filter(function(t){ return t.priority === 'P0'; });
  const p0Done = p0All.filter(isClosed).length;
  const p0Total = p0All.length;

  const prdDone = ALL_TASKS.filter(prdIsDone).length;
  const prdRequired = ALL_TASKS.filter(prdIsRequired).length;

  const teamsCount = TEAM_ORDER.filter(function(t){
    return ALL_TASKS.some(function(task){ return getTeamKey(task.team || '') === t; });
  }).length;

  const progWeeks = programSpanWeeks();

  // helper for "X / Y" number markup
  function xy(doneN, totalN, doneColor) {
    var colorAttr = doneColor ? ' style="color:' + doneColor + '"' : '';
    return '<span' + colorAttr + '>' + doneN + '</span>' +
           '<span class="num-total"> / ' + totalN + '</span>';
  }
  function emptyCls(totalN) { return (totalN === 0) ? ' is-empty' : ''; }

  const row1 = document.createElement('div');
  row1.className = 'summary-cards';
  row1.innerHTML =
    '<div class="summary-card' + emptyCls(tasksTotal) + '"><div class="number">' + xy(tasksDone, tasksTotal) + '</div><div class="label">Complete / Total</div></div>' +
    '<div class="summary-card' + emptyCls(p0Total) + '"><div class="number">' + xy(p0Done, p0Total, 'var(--red)') + '</div><div class="label">P0 Complete / Total</div></div>' +
    '<div class="summary-card ' + (atRisk>0?'warn':'') + '"><div class="number">' + atRisk + '</div><div class="label">Past Ideal Date</div></div>' +
    '<div class="summary-card' + emptyCls(prdRequired) + '"><div class="number">' + xy(prdDone, prdRequired) + '</div><div class="label">PRD Complete / Required</div></div>' +
    '<div class="summary-card"><div class="number">' + teamsCount + '</div><div class="label">Teams</div></div>' +
    '<div class="summary-card"><div class="number">' + (progWeeks ? xy(progWeeks.elapsed, progWeeks.total) : '—') + '</div><div class="label">Weeks Elapsed / Total</div></div>';
  wrap.appendChild(row1);

  // ── Status strip (compact inline, below Row 1) ──
  const statusCounts = {};
  ALL_TASKS.forEach(function(t) {
    if (t.status) statusCounts[t.status] = (statusCounts[t.status] || 0) + 1;
  });
  const statuses = Object.keys(statusCounts);
  if (statuses.length > 0) {
    const STATUS_ORDER = ['To Do', 'Untriaged', 'In Progress', 'Closed'];
    statuses.sort(function(a, b) {
      var ai = STATUS_ORDER.indexOf(a), bi = STATUS_ORDER.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1; if (bi === -1) return -1;
      return ai - bi;
    });
    const strip = document.createElement('div');
    strip.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;align-items:center;border-top:1px solid var(--border);';
    const stripLabel = document.createElement('span');
    stripLabel.style.cssText = 'font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;margin-right:4px;';
    stripLabel.textContent = 'Status';
    strip.appendChild(stripLabel);
    statuses.forEach(function(s) {
      const item = document.createElement('span');
      item.className = 'strip-pill';
      var isActive = activeStatus === s;
      item.style.cssText = 'display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:6px;cursor:pointer;' +
        (isActive
          ? 'background:' + statusColor(s) + '22;border:1.5px solid ' + statusColor(s) + ';'
          : 'background:var(--bg-elevated);border:1px solid var(--border);');
      item.innerHTML = '<span style="font-size:16px;font-weight:700;color:' + statusColor(s) + ';line-height:1">' + statusCounts[s] + '</span>' +
        '<span style="font-size:11px;color:var(--text-secondary)">' + s + '</span>';
      item.title = isActive ? 'Click to clear filter' : 'Filter by ' + s;
      item.addEventListener('click', function() {
        activeStatus = (activeStatus === s) ? 'ALL' : s;
        renderAll(null);
      });
      strip.appendChild(item);
    });
    wrap.appendChild(strip);
  }

  // ── Schedule strip (compact inline, below Status strip) ──
  const scheduleCounts = {};
  ALL_TASKS.forEach(function(t) {
    var sched = getScheduleStatus(t);
    scheduleCounts[sched] = (scheduleCounts[sched] || 0) + 1;
  });
  const scheduleKeys = Object.keys(scheduleCounts);
  if (scheduleKeys.length > 0) {
    const SCHEDULE_ORDER = ['On Track', 'Late Start', 'Behind', 'Ahead', 'Done', '—'];
    scheduleKeys.sort(function(a, b) {
      var ai = SCHEDULE_ORDER.indexOf(a), bi = SCHEDULE_ORDER.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1; if (bi === -1) return -1;
      return ai - bi;
    });
    const sStrip = document.createElement('div');
    sStrip.id = 'schedule-strip';
    sStrip.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;';
    const sLabel = document.createElement('span');
    sLabel.style.cssText = 'font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;margin-right:4px;';
    sLabel.textContent = 'Schedule';
    sStrip.appendChild(sLabel);
    scheduleKeys.forEach(function(s) {
      const item = document.createElement('span');
      item.className = 'strip-pill';
      var isActive = activeSchedule === s;
      item.style.cssText = 'display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:6px;cursor:pointer;' +
        (isActive
          ? 'background:' + scheduleColor(s) + '22;border:1.5px solid ' + scheduleColor(s) + ';'
          : 'background:var(--bg-elevated);border:1px solid var(--border);');
      item.innerHTML = '<span style="font-size:16px;font-weight:700;color:' + scheduleColor(s) + ';line-height:1">' + scheduleCounts[s] + '</span>' +
        '<span style="font-size:11px;color:var(--text-secondary)">' + s + '</span>';
      item.title = isActive ? 'Click to clear filter' : 'Filter by ' + s;
      item.addEventListener('click', function() {
        activeSchedule = (activeSchedule === s) ? 'ALL' : s;
        renderAll(null);
      });
      sStrip.appendChild(item);
    });
    wrap.appendChild(sStrip);
  }

  wrap.style.marginBottom = '22px';
  return wrap;
}

function businessDaysBetween(from, to) {
  var count = 0;
  var cur = new Date(from.getTime());
  while (cur < to) {
    var dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
    cur = new Date(cur.getTime() + DAY_MS);
  }
  return count;
}

function buildPrdAlert() {
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today.getTime() + 21 * DAY_MS);

  // Collect overdue + upcoming items into a single list
  const items = [];
  ALL_TASKS.forEach(function(t) {
    var state = getPrdState(t.prd);
    if (state === 'na' || state === 'done') return;
    const s = parseDate(t.start);
    if (!s) return;
    if (s < today) {
      items.push({ task: t, state: state, urgency: 'overdue', days: businessDaysBetween(s, today) });
    } else if (s <= cutoff) {
      items.push({ task: t, state: state, urgency: 'upcoming', days: businessDaysBetween(today, s) });
    }
  });

  const div = document.createElement('div');
  div.className = 'prd-alert' + (items.length > 0 ? ' show' : '');
  if (items.length === 0) return div;

  // Group items by PM (first PM if comma-separated, "— Unassigned —" if blank)
  const byPm = {};
  items.forEach(function(it) {
    var pmKey = it.task.pm ? it.task.pm.split(',')[0].trim() : '— Unassigned —';
    if (!pmKey) pmKey = '— Unassigned —';
    if (!byPm[pmKey]) byPm[pmKey] = [];
    byPm[pmKey].push(it);
  });

  // Sort items inside each PM: overdue first (most-slipped first), then upcoming (soonest first)
  Object.keys(byPm).forEach(function(pm) {
    byPm[pm].sort(function(a, b) {
      if (a.urgency !== b.urgency) return a.urgency === 'overdue' ? -1 : 1;
      if (a.urgency === 'overdue') return b.days - a.days;
      return a.days - b.days;
    });
  });

  // Sort PMs: most items first, then alphabetical, "Unassigned" last
  const pmKeys = Object.keys(byPm).sort(function(a, b) {
    var aIsUnassigned = a.startsWith('—');
    var bIsUnassigned = b.startsWith('—');
    if (aIsUnassigned !== bIsUnassigned) return aIsUnassigned ? 1 : -1;
    if (byPm[b].length !== byPm[a].length) return byPm[b].length - byPm[a].length;
    return a.localeCompare(b);
  });

  // Build markup
  var html = '<div class="prd-alert-title">PRD needed — ' + items.length + ' task' + (items.length !== 1 ? 's' : '') + '</div>';
  html += '<div class="prd-pm-list">';
  pmKeys.forEach(function(pm) {
    var pmItems = byPm[pm];
    var displayName = pm.startsWith('—') ? pm : pm.split(/\s+/).slice(0, 2).join(' ');
    html += '<div class="prd-pm-card">' +
      '<div class="prd-pm-header">' +
        '<span class="prd-pm-toggle">▼</span>' +
        '<span class="prd-pm-name">' + displayName + '</span>' +
        '<span class="prd-pm-count">' + pmItems.length + '</span>' +
      '</div>' +
      '<ol class="prd-pm-items">';
    pmItems.forEach(function(it) {
      var t = it.task;
      var stateLabel = it.state === 'draft' ? 'Draft' : it.state === 'review' ? 'Rev' : it.state === 'todo' ? 'To Do' : 'N';
      var stateClass = 'prd-' + it.state;
      var urgencyText = it.urgency === 'overdue'
        ? 'started ' + it.days + 'd ago'
        : 'starts in ' + it.days + 'd';
      var urgencyColor = it.urgency === 'overdue' ? 'var(--red)' : 'var(--amber)';
      var keyMarkup = t.epicUrl
        ? '<a href="' + t.epicUrl + '" target="_blank" class="prd-task-key">[' + (t.epic || '') + ']</a>'
        : '<span class="prd-task-key">[' + (t.epic || '') + ']</span>';
      var stateBadge = '<span class="prd-task-state prd-badge ' + stateClass + '">' + stateLabel + '</span>';
      // 'missing' state has no prdUrl by definition; wrapPrdLink handles
      // the empty-url case by returning the badge unchanged.
      var stateBadgeMarkup = wrapPrdLink(stateBadge, t.prdUrl);
      html += '<li>' +
        keyMarkup + ' ' +
        t.task +
        ' ' + stateBadgeMarkup +
        '<span class="prd-task-urgency" style="color:' + urgencyColor + '">' + urgencyText + '</span>' +
        '</li>';
    });
    html += '</ol></div>';
  });
  html += '</div>';

  div.innerHTML = html;

  // Wire collapse toggle on each PM card header
  div.querySelectorAll('.prd-pm-header').forEach(function(h) {
    h.addEventListener('click', function() {
      h.parentElement.classList.toggle('collapsed');
    });
  });

  return div;
}

function buildLegend() {
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;align-items:center;';
  div.innerHTML = TEAM_ORDER.map(function(t) {
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)">' +
      '<span style="width:8px;height:8px;border-radius:50%;background:' + (TEAM_COLORS[t]||'#64748b') + ';flex-shrink:0;display:inline-block"></span>' + t + '</span>';
  }).join('') +
  '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)">' +
    '<span style="width:8px;height:8px;background:#f59e0b;transform:rotate(45deg);flex-shrink:0;display:inline-block"></span>Ideal</span>' +
  '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)">' +
    '<span style="display:inline-block;width:16px;height:1.5px;background:var(--red)"></span>Today</span>' +
  '<span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text-secondary)">' +
    '<span class="prd-badge prd-missing" style="font-size:9px;padding:1px 4px">PRD</span>missing</span>' +
  '<span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text-secondary)">' +
    '<span class="prd-badge prd-review" style="font-size:9px;padding:1px 4px">Rev</span>Review</span>' +
  '<span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text-secondary)">' +
    '<span class="prd-badge prd-done" style="font-size:9px;padding:1px 4px">PRD</span>done</span>';
  return div;
}

function buildFilterGroup(label, options, current, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'filter-group';
  const lbl = document.createElement('span');
  lbl.className = 'filter-label';
  lbl.textContent = label;
  wrap.appendChild(lbl);
  options.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (opt === current ? ' active' : '');
    btn.textContent = opt === 'ALL' ? 'All ' + label + 's' : opt;
    btn.onclick = function() {
      wrap.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      onChange(opt);
    };
    wrap.appendChild(btn);
  });
  return wrap;
}

function buildTimeline(tasks, teamFilter) {
  var showExtra = teamFilter && teamFilter !== 'ALL';
  const today = new Date(); today.setHours(0,0,0,0);

  const weeks = [];
  let d = new Date(TIMELINE_START);
  while (d < TIMELINE_END) { weeks.push(new Date(d)); d = new Date(d.getTime()+7*DAY_MS); }
  const weekW = GANTT_W / weeks.length;

  const months = [];
  weeks.forEach(function(w) {
    const key = w.getFullYear() + '-' + w.getMonth();
    if (!months.length || months[months.length-1].key !== key)
      months.push({key:key, name:w.toLocaleDateString('en-US',{month:'short',year:'numeric'}), count:0});
    months[months.length-1].count++;
  });

  const ganttHdr =
    '<div class="gantt-header-wrap" style="width:' + GANTT_W + 'px">' +
    '<div class="gantt-months-row">' +
    months.map(function(m){ return '<div class="gantt-month-label" style="width:' + (m.count*weekW) + 'px">' + m.name + '</div>'; }).join('') +
    '</div><div class="gantt-weeks-row">' +
    weeks.map(function(w){ return '<div class="gantt-week-label" style="width:' + weekW + 'px">' + (w.getMonth()+1) + '/' + w.getDate() + '</div>'; }).join('') +
    '</div></div>';

  const grouped = {};
  TEAM_ORDER.forEach(function(t) { grouped[t] = []; });
  tasks.forEach(function(t) {
    var key = getTeamKey(t.team || '');
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(t);
  });

  function tip(t) { return '<span class="col-info" data-tip="' + t + '">i</span>'; }
  let rows =
    '<thead><tr>' +
    '<th class="info-col sticky-pri" style="width:42px">Pri' + tip('Priority from Notion (P0 \u2192 P1 \u2192 P2)') + '</th>' +
    '<th class="info-col sticky-task" style="width:260px">Task' + tip('Task name from Jira \u2192 Notion \u2014 synced via Realistic Scenario sheet') + '</th>' +
    '<th class="info-col" data-col="prd" style="width:50px" title="Click to hide">PRD' + tip('PRD status from Notion: \u2713=done, Draft, Rev=In Review, N=missing, \u2212=N/A') + '</th>' +
    '<th class="info-col" data-col="risk" style="width:50px" title="Click to hide">Risk' + tip('Risk factor \u2014 from Realistic Scenario sheet (Low / Medium / High)') + '</th>' +
    '<th class="info-col" data-col="size" style="width:50px" title="Click to hide">Size' + tip('T-shirt size estimation in weeks \u2014 from Overall sheet (Small / Medium / Large / Extra Large). Hover any chip for the full label.') + '</th>' +
    '<th class="info-col" data-col="start" style="width:55px" title="Click to hide"><span class="hdr-pre">Plan</span>Start' + tip('Planned start date \u2014 from Realistic Scenario sheet') + '</th>' +
    '<th class="info-col" data-col="end" style="width:55px" title="Click to hide"><span class="hdr-pre">Plan</span>End' + tip('Planned end date \u2014 from Realistic Scenario sheet') + '</th>' +
    (showActual ? '<th class="info-col" data-col="actStart" style="width:55px"><span class="hdr-pre">Act</span>Start' + tip('Actual start date \u2014 from Jira (synced via Notion). \u2018-\u2019 if not started yet.') + '</th><th class="info-col" data-col="actEnd" style="width:55px"><span class="hdr-pre">Act</span>End' + tip('Actual end date \u2014 from Jira (synced via Notion). \u2018-\u2019 if not finished yet.') + '</th>' : '') +
    '<th class="info-col" data-col="ideal" style="width:55px" title="Click to hide">Ideal' + tip('Target delivery per SOW \u2014 from Realistic Scenario sheet') + '</th>' +
    '<th class="info-col" data-col="schedule" style="width:82px" title="Click to hide">Schedule' + tip('Status-driven. Closed: compares actual end vs planned end (\u00b13 day tolerance) \u2192 Behind / Ahead / On Track. In Progress: On Track. Not started: Behind when planned start has passed, otherwise \u2014. Hover any pill for the per-task reason.') + '</th>' +
    (showExtra ? '<th class="info-col" data-col="alloc" style="width:90px" title="Click to hide">Alloc' + tip('Team allocation % \u2014 from Realistic Scenario sheet') + '</th><th class="info-col" data-col="status" style="width:90px" title="Click to hide">Status' + tip('Task status from Notion (To Do / In Progress / Closed \u2026)') + '</th>' : '') +
    '<th class="gantt-col" style="width:' + GANTT_W + 'px;min-width:' + GANTT_W + 'px">' + ganttHdr + '</th>' +
    '</tr></thead><tbody>';

  // render TEAM_ORDER first, then any remaining groups (unknown teams)
  const renderOrder = TEAM_ORDER.concat(
    Object.keys(grouped).filter(function(k) { return TEAM_ORDER.indexOf(k) === -1 && grouped[k].length > 0; })
  );

  function sortTaskList(arr) {
    var s = arr.slice();
    if (activeSort === 'start') s.sort(function(a,b){ return compareDate(a.start, b.start); });
    if (activeSort === 'end')   s.sort(function(a,b){ return compareDate(a.end,   b.end);   });
    if (activeSort === 'ideal') s.sort(function(a,b){ return compareDate(a.ideal, b.ideal); });
    return s;
  }

  function buildTaskRow(t, color, showTeamBorder) {
    const sd = parseDate(t.start), ed = parseDate(t.end), id = parseDate(t.ideal);
    const isAtRisk = ed && id && ed > id;
    var prdState = getPrdState(t.prd);
    var prdBadge;
    if (!t.pm || prdState === 'na') {
      prdBadge = '<span style="color:#475569">-</span>';
    } else if (prdState === 'done') {
      prdBadge = wrapPrdLink('<span class="prd-badge prd-done">&#10003;</span>', t.prdUrl);
    } else if (prdState === 'draft') {
      prdBadge = wrapPrdLink('<span class="prd-badge prd-draft">Draft</span>', t.prdUrl);
    } else if (prdState === 'review') {
      prdBadge = wrapPrdLink('<span class="prd-badge prd-review">Rev</span>', t.prdUrl);
    } else if (prdState === 'todo') {
      prdBadge = wrapPrdLink('<span class="prd-badge prd-todo">To Do</span>', t.prdUrl);
    } else {
      prdBadge = '<span class="prd-badge prd-missing">N</span>';
    }
    // Lead/PM moved to team header (2026-05-07). Tooltip still keeps the per-task value via pmFull.
    const pmFull = t.pm || '-';
    const ttData = {
      task:t.task, epic:t.epic, lead:t.lead, allocation:t.allocation,
      headcount:t.headcount, pm:pmFull, pmo:t.pmo, prd:t.prd, prdUrl:t.prdUrl,
      start:t.start, end:t.end, ideal:id?fmtFull(id):'', effort:t.effort,
      actualStart:t.actualStart||'', actualEnd:t.actualEnd||'',
      statusChangedAt:t.statusChangedAt||'', resolvedAt:t.resolvedAt||'',
      risk:t.risk, note:t.note, status:t.status,
      blocking:t.blocking||[], blockedBy:t.blockedBy||[],
    };
    const tt = JSON.stringify(ttData).replace(/'/g, '&#39;');
    const linkInner = t.epicUrl
      ? '<a href="' + t.epicUrl + '" target="_blank">' + t.task + '</a>'
      : t.task;
    const link = (t.epic ? '<span class="task-jira-key">' + t.epic + '</span>' : '')
      + '<span class="task-name-wrap">' + linkInner + '</span>';
    var ganttInner = '<div class="gantt-area" style="width:' + GANTT_W + 'px;position:relative;">';
    // Body verticals removed entirely (2026-04-29) — header dividers carry the time anchoring.
    const todayDays = dayOffset(today);
    if (todayDays >= 0 && todayDays <= totalDays)
      ganttInner += '<div class="today-line" style="left:' + dayToPx(todayDays) + 'px"></div>';
    // ── Bar rendering ──
    // Case 1 (no effective actual data): single full-height plan bar (existing behaviour).
    // Case 2/3 (effective actual present): half-split — plan grey on top, actual on bottom,
    // overrun (red hatch) past plan-end if applicable. See spec 2026-05-07.
    const actSdStr = effectiveActualStart(t);
    const actEdStr = effectiveActualEnd(t);
    const actSd_   = parseDate(actSdStr);
    const actEd_   = parseDate(actEdStr);
    const hasActual = actSd_ && actEd_;
    // Helper: build the style+onclick attrs for one segment. `label` is
    // rendered as a child span that fades in when the bar is hovered.
    function seg(left, width, extraStyle, klass, label) {
      var base = 'left:' + left + 'px;width:' + Math.max(3, width) + 'px;' + extraStyle;
      var labelHtml = label ? '<span class="bar-label">' + label + '</span>' : '';
      // Overrun (red hatch / "Late") — click opens the Add Late Reason
      // modal, hover shows the late-reason tooltip (custom JS, no native
      // title attr so the two don't fight). data-jira + data-task carry
      // the context to the delegated handlers.
      if (klass.indexOf('gantt-overrun') >= 0 && t.epic) {
        var taskEsc = String(t.task || '').replace(/"/g, '&quot;');
        return '<div class="' + klass + '" style="' + base + '"' +
          ' data-jira="' + t.epic + '" data-task="' + taskEsc + '">' + labelHtml + '</div>';
      }
      if (t.epicUrl) {
        return '<div class="' + klass + '" style="' + base + 'cursor:pointer;" onclick="window.open(\'' + t.epicUrl + '\',\'_blank\')">' + labelHtml + '</div>';
      }
      return '<div class="' + klass + '" style="' + base + '">' + labelHtml + '</div>';
    }

    var planLabel = (sd && ed) ? 'Plan: ' + fmtShort(sd) + ' → ' + fmtShort(ed) : '';

    // Team colour passed via --c CSS var so children (the label) and pseudo-
    // states (in-progress-ongoing gradient) can reference it without re-reading
    // the inline `background:` string. background-color: var(--c) is set by CSS
    // on .gantt-bar / .gantt-actual; the ongoing gradient overrides it.
    var colorVar = '--c:' + color + ';';

    if (selectedScenarios.length > 1) {
      // Multi-select: stacked sub-bars in 4 fixed lanes, each with a small
      // letter badge anchored to the bar's left edge so the scenario name
      // is readable without hovering.
      var multiClick = t.epicUrl ? ' onclick="window.open(\'' + t.epicUrl + '\',\'_blank\')"' : '';
      var multiCur   = t.epicUrl ? 'cursor:pointer;' : '';

      var SCEN_LETTERS = { optimistic: 'O', realistic: 'R', pessimist: 'P' };
      ['optimistic', 'realistic', 'pessimist'].forEach(function(scenario) {
        if (selectedScenarios.indexOf(scenario) < 0) return;
        var sc = t[scenario];
        if (!sc || !sc.start || !sc.end) return;
        var sd2 = parseDate(sc.start);
        var ed2 = parseDate(sc.end);
        if (!sd2 || !ed2) return;
        var l  = dayToPx(dayOffset(sd2));
        var w  = Math.max(3, dayToPx(dayOffset(ed2)) - l);
        var sName = scenario.charAt(0).toUpperCase() + scenario.slice(1);
        var lbl   = sName + ': ' + fmtShort(sd2) + ' → ' + fmtShort(ed2);
        ganttInner += '<div class="gantt-multi scen-' + scenario + '" ' +
          'style="left:' + l + 'px;width:' + w + 'px;' + colorVar + multiCur + '"' +
          multiClick + '>' +
          '<span class="bar-label">' + lbl + '</span>' +
          '</div>';
        ganttInner += '<div class="gantt-lane-badge lane-' + scenario + '" ' +
          'style="left:' + l + 'px;">' + SCEN_LETTERS[scenario] + '</div>';
      });

      if (hasActual) {
        var aL = dayToPx(dayOffset(actSd_));
        var aW = Math.max(3, dayToPx(dayOffset(actEd_)) - aL);
        var isOngoing2 = (t.status || '').toLowerCase().trim() === 'in progress' && !t.actualEnd;
        var actEnd2    = isOngoing2 ? 'ongoing' : fmtShort(actEd_);
        var aLbl       = 'Actual: ' + fmtShort(actSd_) + ' → ' + actEnd2;
        ganttInner += '<div class="gantt-multi scen-actual" ' +
          'style="left:' + aL + 'px;width:' + aW + 'px;' + multiCur + '"' +
          multiClick + '>' +
          '<span class="bar-label">' + aLbl + '</span>' +
          '</div>';
        ganttInner += '<div class="gantt-lane-badge lane-actual" ' +
          'style="left:' + aL + 'px;">A</div>';
      }
    } else if (!hasActual && sd && ed) {
      // Case 1 — plan-only single bar (legacy class .gantt-bar)
      const left = dayToPx(dayOffset(sd));
      const width = Math.max(3, dayToPx(dayOffset(ed)) - left);
      ganttInner += seg(left, width, colorVar, 'gantt-bar', planLabel);
    } else if (hasActual) {
      // Case 2/3 — half-split
      if (sd && ed) {
        const planLeft = dayToPx(dayOffset(sd));
        const planWidth = dayToPx(dayOffset(ed)) - planLeft;
        ganttInner += seg(planLeft, planWidth, '', 'gantt-plan', planLabel);
      }
      const actLeft  = dayToPx(dayOffset(actSd_));
      const actEdPx  = dayToPx(dayOffset(actEd_));
      const planEdPx = ed ? dayToPx(dayOffset(ed)) : null;
      const isOngoing = (t.status || '').toLowerCase().trim() === 'in progress' && !t.actualEnd;
      const actClass = 'gantt-actual' + (isOngoing ? ' in-progress-ongoing' : '');
      // For ongoing tasks (In Progress + no recorded actualEnd) the bar visually
      // ends at today as a placeholder, but the label text must NOT claim
      // `today` as an end — that reads like a recorded end date. Say "ongoing"
      // instead. The bar shape carries the visual cue.
      const actEndStr = isOngoing ? 'ongoing' : fmtShort(actEd_);
      const actLabel  = 'Actual: ' + fmtShort(actSd_) + ' → ' + actEndStr;

      if (planEdPx !== null && actEdPx > planEdPx) {
        // Overrun — split actual into within-plan + overrun
        if (actLeft < planEdPx) {
          ganttInner += seg(actLeft, planEdPx - actLeft, colorVar + 'border-bottom-right-radius:0;', actClass, actLabel);
        }
        const overrunLabel = 'Late: ' + fmtShort(ed) + ' → ' + actEndStr;
        ganttInner += seg(planEdPx, actEdPx - planEdPx, '', 'gantt-overrun', overrunLabel);
      } else {
        ganttInner += seg(actLeft, actEdPx - actLeft, colorVar, actClass, actLabel);
      }
    }
    if (id) ganttInner += '<div class="ideal-diamond" style="left:' + dayToPx(dayOffset(id)) + 'px"></div>';
    ganttInner += '</div>';
    const priCls = t.priority ? 'pri-' + t.priority : 'pri-default';
    var priStyle = showTeamBorder ? 'border-left:3px solid ' + color + ';' : '';
    return '<tr class="task-row' + (isAtRisk?' at-risk':'') + '" data-epic="' + (t.epic||'') + '" data-task="' + (t.task||'').replace(/"/g,'&quot;') + '" data-tt=\'' + tt + '\'>' +
      '<td class="info-col sticky-pri" style="' + priStyle + '"><span class="priority-badge ' + priCls + '">' + (t.priority||'-') + '</span></td>' +
      '<td class="info-col sticky-task task-name-cell">' + link + '</td>' +
      '<td class="info-col" data-col="prd">' + prdBadge + '</td>' +
      '<td class="info-col" data-col="risk">' + buildRiskBadge(t.risk) + '</td>' +
      '<td class="info-col" data-col="size">' + buildTshirtBadge(t.engSize) + '</td>' +
      '<td class="info-col date-cell" data-col="start">' + fmtShort(sd) + '</td>' +
      '<td class="info-col date-cell" data-col="end">' + fmtShort(ed) + '</td>' +
      (showActual ? '<td class="info-col date-cell" data-col="actStart">' + fmtShort(parseDate(t.actualStart)) + '</td><td class="info-col date-cell" data-col="actEnd">' + fmtShort(parseDate(t.actualEnd)) + '</td>' : '') +
      '<td class="info-col date-cell" data-col="ideal"' + (isAtRisk?' style="color:#fca5a5;font-weight:600"':'') + '>' + fmtShort(id) + '</td>' +
      '<td class="info-col" data-col="schedule">' + buildScheduleBadge(t) + '</td>' +
      (showExtra ? '<td class="info-col date-cell" data-col="alloc">' + (t.allocation||'-') + '</td><td class="info-col date-cell" data-col="status">' + (t.status||'-') + '</td>' : '') +
      '<td class="gantt-col">' +
        (t.status ? '<span class="status-dot" data-status="' + t.status + '" style="background:' + statusColor(t.status) + '"><span class="status-text">' + t.status + '</span></span>' : '') +
        ganttInner +
      '</td>' +
      '</tr>';
  }

  if (flatView) {
    var flatTasks = [];
    renderOrder.forEach(function(team) {
      (grouped[team] || []).forEach(function(t) { flatTasks.push(t); });
    });
    flatTasks = sortTaskList(flatTasks);
    flatTasks.forEach(function(t) {
      var teamColor = TEAM_COLORS[getTeamKey(t.team||'')] || '#64748b';
      rows += buildTaskRow(t, teamColor, true);
    });
  } else {
    renderOrder.forEach(function(team) {
      var teamTasks = sortTaskList(grouped[team] || []);
      if (!teamTasks.length) return;
      var color = TEAM_COLORS[team] || '#64748b';
      // Lead/PM moved out of per-task columns into here (2026-05-07).
      // Base colspan dropped from 10 to 8 (refactor 2026-05-07), then bumped
      // to 9 (2026-05-20) when the T-shirt Size column was added between Risk
      // and Plan Start. showExtra adds Alloc+Status (2); showActual adds Act
      // Start + Act End (2).
      var teamColspan = 9 + (showExtra ? 2 : 0) + (showActual ? 2 : 0);
      // Continue the Today line through the team-header row so it doesn't
      // visibly break at every team boundary.
      var teamTodayLine = '';
      var teamTodayDays = dayOffset(today);
      if (teamTodayDays >= 0 && teamTodayDays <= totalDays) {
        teamTodayLine = '<div class="today-line" style="left:' + dayToPx(teamTodayDays) + 'px"></div>';
      }
      var ppl = teamPeople(teamTasks);
      var peopleHtml = '';
      if (ppl.leads.length) peopleHtml += '<span class="role"> · Lead:</span> ' + htmlSafe(ppl.leads.join(', '));
      if (ppl.pms.length)   peopleHtml += '<span class="role"> · PM:</span> '   + htmlSafe(ppl.pms.join(', '));
      if (ppl.pmos.length)  peopleHtml += '<span class="role"> · PMO:</span> '  + htmlSafe(ppl.pmos.join(', '));
      rows += '<tr class="team-header">' +
        '<td class="info-col" colspan="' + teamColspan + '" style="color:' + color + ';border-left:3px solid ' + color + '">' +
          team +
          ' <span class="team-count">(' + teamTasks.length + ')</span>' +
          (peopleHtml ? '<span class="team-people">' + peopleHtml + '</span>' : '') +
        '</td>' +
        '<td class="gantt-col">' + teamTodayLine + '</td></tr>';
      teamTasks.forEach(function(t) {
        rows += buildTaskRow(t, color, false);
      });
    });
  }
  rows += '</tbody>';

  const container = document.createElement('div');
  container.className = 'timeline-container';
  const table = document.createElement('table');
  table.className = 'timeline';
  table.innerHTML = rows;
  container.appendChild(table);

  const tooltip = document.getElementById('tooltip');
  var tooltipTimer = null;

  // Slim row tooltip: only the fields that aren't already visible elsewhere on
  // the row (Allocation, Effort, dependencies). Every other piece is in a
  // column, the team header, the schedule chip, the status dot, or the bar
  // hover label, so duplicating it here would just be noise.
  function showRowTooltip(row) {
    try {
      const d = JSON.parse(row.dataset.tt);
      let html = '<div class="tt-title">' + d.task + '</div>';
      if (d.allocation) html += '<div class="tt-row"><span class="tt-label">Allocation</span><span class="tt-value">' + d.allocation + '</span></div>';
      html += '<div class="tt-row"><span class="tt-label">Effort</span><span class="tt-value">' + d.effort + ' weeks</span></div>';
      if (d.blocking && d.blocking.length) html += '<div class="tt-row"><span class="tt-label">Blocking</span><span class="tt-value" style="color:#fbbf24">' + d.blocking.join(', ') + '</span></div>';
      if (d.blockedBy && d.blockedBy.length) html += '<div class="tt-row"><span class="tt-label">Blocked by</span><span class="tt-value" style="color:#f87171">' + d.blockedBy.join(', ') + '</span></div>';
      tooltip.innerHTML = html;
      tooltip.classList.add('show');
    } catch(e) {}
  }

  table.querySelectorAll('.task-row').forEach(function(row) {
    var onNameCell = false;

    row.addEventListener('mouseenter', function() {
      tooltipTimer = setTimeout(function() {
        if (!onNameCell) showRowTooltip(row);
      }, 8000);
    });

    // Task name cell: full name now renders inline via CSS hover (no tooltip).
    // Still suppress the row tooltip while the cursor is on this cell so the
    // expanded name has the spotlight.
    var nameCell = row.querySelector('td.task-name-cell');
    if (nameCell) {
      nameCell.addEventListener('mouseenter', function() {
        onNameCell = true;
        clearTimeout(tooltipTimer);
      });
      nameCell.addEventListener('mouseleave', function() {
        onNameCell = false;
        tooltipTimer = setTimeout(function() { if (!onNameCell) showRowTooltip(row); }, 8000);
      });
    }

    row.addEventListener('mousemove', function(e) {
      var ttW  = tooltip.offsetWidth;
      var ttH  = tooltip.offsetHeight;
      var left = e.clientX + 16;
      var top  = e.clientY + 10;
      if (left + ttW > window.innerWidth  - 8) left = e.clientX - ttW - 16;
      if (top  + ttH > window.innerHeight - 8) top  = e.clientY - ttH - 10;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
    });
    row.addEventListener('mouseleave', function() {
      onNameCell = false;
      clearTimeout(tooltipTimer);
      tooltip.classList.remove('show');
    });
  });

  // ── Column header ℹ tooltips (instant, fixed position) ──
  table.querySelectorAll('.col-info').forEach(function(icon) {
    icon.addEventListener('mouseenter', function(e) {
      tooltip.innerHTML = '<div style="font-size:12px;line-height:1.6;color:var(--text-secondary)">' + icon.getAttribute('data-tip') + '</div>';
      tooltip.classList.add('show');
      var ttW = tooltip.offsetWidth, ttH = tooltip.offsetHeight;
      var left = e.clientX + 16, top = e.clientY + 10;
      if (left + ttW > window.innerWidth  - 8) left = e.clientX - ttW - 16;
      if (top  + ttH > window.innerHeight - 8) top  = e.clientY - ttH - 10;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
    });
    icon.addEventListener('mousemove', function(e) {
      var ttW = tooltip.offsetWidth, ttH = tooltip.offsetHeight;
      var left = e.clientX + 16, top = e.clientY + 10;
      if (left + ttW > window.innerWidth  - 8) left = e.clientX - ttW - 16;
      if (top  + ttH > window.innerHeight - 8) top  = e.clientY - ttH - 10;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
    });
    icon.addEventListener('mouseleave', function() {
      tooltip.classList.remove('show');
    });
  });

  // Status dot expands inline on hover via CSS — no JS tooltip needed.

  return container;
}

function getPrdState(prd) {
  if (!prd) return 'missing';
  var v = prd.trim().toLowerCase();
  if (v === '-') return 'na';
  if (v === 'y' || v === 'yes') return 'done';
  if (v === 'draft') return 'draft';
  if (v === 'in review' || v === 'review') return 'review';
  if (v === 'to do') return 'todo';
  return 'missing';
}

function isClosed(t) { return t && t.status === 'Closed'; }
function prdIsDone(t) { return !!(t && t.pm) && getPrdState(t.prd) === 'done'; }
function prdIsRequired(t) { return !!(t && t.pm) && getPrdState(t.prd) !== 'na'; }

// Wrap a PRD badge in an anchor pointing at the PRD page when prdUrl exists.
// Returns the original badge HTML unchanged when prdUrl is empty (e.g. the
// 'missing' state, or any task with no PRD link recorded yet) so the caller
// doesn't have to special-case that branch.
function wrapPrdLink(badgeHtml, prdUrl) {
  if (!prdUrl) return badgeHtml;
  return '<a class="prd-badge-link" href="' + prdUrl +
    '" target="_blank" rel="noopener" title="Open PRD">' + badgeHtml + '</a>';
}

// Minimal HTML escaper for body-context text (names from Sheets / Notion).
function htmlSafe(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Collect unique Lead and PM values across a team's task set. PM field is
// comma-separated for multi-PM tasks. Used by the team-header row to surface
// the team's people inline (2026-05-07).
function teamPeople(teamTasks) {
  var leads = [], pms = [], pmos = [];
  teamTasks.forEach(function(t) {
    if (t.lead) {
      var L = t.lead.trim();
      if (L && leads.indexOf(L) === -1) leads.push(L);
    }
    if (t.pm) {
      t.pm.split(',').forEach(function(p) {
        var P = p.trim();
        if (P && pms.indexOf(P) === -1) pms.push(P);
      });
    }
    if (t.pmo) {
      t.pmo.split(',').forEach(function(p) {
        var P = p.trim();
        if (P && pmos.indexOf(P) === -1) pmos.push(P);
      });
    }
  });
  return { leads: leads, pms: pms, pmos: pmos };
}

function programSpanWeeks() {
  var starts = [], ends = [];
  for (var i = 0; i < ALL_TASKS.length; i++) {
    var s = parseDate(ALL_TASKS[i].start);
    var e = parseDate(ALL_TASKS[i].end);
    if (s) starts.push(s.getTime());
    if (e) ends.push(e.getTime());
  }
  if (!starts.length || !ends.length) return null;
  var earliest = Math.min.apply(null, starts);
  var latest   = Math.max.apply(null, ends);
  var total = Math.ceil((latest - earliest) / (7 * 24 * 60 * 60 * 1000));
  if (total <= 0) total = 1;
  var elapsed = Math.max(0, Math.floor((Date.now() - earliest) / (7 * 24 * 60 * 60 * 1000)));
  if (elapsed > total) elapsed = total;
  return { elapsed: elapsed, total: total };
}

// ── Effective actual dates for Gantt bar rendering + tooltip ──
// Encodes the status-driven fallback rules in one place: explicit dates win,
// then status-transition timestamp (In Progress / Closed) for start, then
// resolution date (Closed) or today (In Progress) for end. See spec
// docs/superpowers/specs/2026-05-07-actual-bar-on-gantt-design.md.
function effectiveActualStart(t) {
  if (t.actualStart) return t.actualStart;
  var s = (t.status || '').toLowerCase().trim();
  var startedOrFinished = s === 'in progress' || /closed|done|complete/.test(s);
  return startedOrFinished ? (t.statusChangedAt || '') : '';
}

function effectiveActualEnd(t) {
  if (t.actualEnd) return t.actualEnd;
  var s = (t.status || '').toLowerCase().trim();
  if (/closed|done|complete/.test(s)) return t.resolvedAt || '';
  if (s === 'in progress') return new Date().toISOString().slice(0, 10);
  return '';
}

function getScheduleStatus(t) {
  // Jira / Notion can populate actualStart / actualEnd with target dates
  // even before a task starts (or leave stale data after a status revert).
  // Use the task's STATUS as the source of truth for what stage it's in;
  // only consult the actual dates within the matching branch.
  var status = (t.status || '').toLowerCase().trim();
  var isClosed = /closed|done|complete/.test(status);
  var isInProgress = status === 'in progress';

  // Closed: compare actual end vs planned end. Prefer explicit actualEnd;
  // fall back to resolvedAt (Jira resolution timestamp) when actualEnd is empty.
  // If neither is available (or planned end missing), return 'Done' — task
  // is closed, but on-time / late can't be judged.
  if (isClosed) {
    var endStr = t.actualEnd || t.resolvedAt || '';
    if (!t.end || !endStr) return 'Done';
    var projDate = parseDate(endStr);
    var baseDate = parseDate(t.end);
    if (!projDate || !baseDate) return '—';
    var diff = Math.round((projDate - baseDate) / DAY_MS);
    if (diff > 3)  return 'Behind';
    if (diff < -3) return 'Ahead';
    return 'On Track';
  }

  // In Progress: normally On Track (we can't compare end dates yet). But if
  // today is already past the planned end and the task is still in progress
  // (no actualEnd recorded), the chip flips to 'Behind' — the plan deadline
  // has been blown through even though the task hasn't formally completed.
  if (isInProgress) {
    if (t.end) {
      var planEnd = parseDate(t.end);
      var today = new Date(); today.setHours(0,0,0,0);
      if (planEnd && planEnd < today) return 'Behind';
    }
    return 'On Track';
  }

  // Pre-start (To Do / Untriaged / Blocked / anything else not closed-or-progressing):
  // ignore notion dates entirely. Only flag Late Start if planned start has
  // passed. Distinct from 'Behind' (which is reserved for Closed tasks that
  // finished past the planned end) — different semantics, different chip.
  if (t.start) {
    var startDate = parseDate(t.start);
    var today = new Date(); today.setHours(0,0,0,0);
    if (startDate && startDate < today) return 'Late Start';
  }
  return '—';
}

function buildScheduleBadge(t) {
  var s = getScheduleStatus(t);
  var explain = explainSchedule(t, s).replace(/"/g, '&quot;');
  if (s === 'Behind')     return '<span class="schedule-badge schedule-behind" title="' + explain + '">Behind</span>';
  if (s === 'Late Start') return '<span class="schedule-badge schedule-late-start" title="' + explain + '">Late Start</span>';
  if (s === 'Ahead')      return '<span class="schedule-badge schedule-ahead" title="' + explain + '">Ahead</span>';
  if (s === 'On Track')   return '<span class="schedule-badge schedule-on-track" title="' + explain + '">On Track</span>';
  if (s === 'Done')       return '<span class="schedule-badge schedule-done" title="' + explain + '">Done</span>';
  return '<span style="color:var(--text-muted)" title="' + explain + '">—</span>';
}

// Per-task hover explanation: why this task is Behind / On Track / Ahead.
// Spelled out in concrete dates and day-counts so it's auditable, not a
// reminder of the generic rules (those live in the column header tooltip).
// Same status-based branching as getScheduleStatus.
function explainSchedule(t, s) {
  var status = (t.status || '').toLowerCase().trim();
  var isClosed = /closed|done|complete/.test(status);
  var isInProgress = status === 'in progress';
  var statusLabel = t.status || '—';

  // Closed: actual end vs planned end. Prefer explicit actualEnd; fall back
  // to resolvedAt (Jira resolution timestamp). If neither is available the
  // chip is the neutral "Done" pill.
  if (isClosed) {
    var endStr = t.actualEnd || t.resolvedAt || '';
    // Slice to YYYY-MM-DD for display — either field could be a DateTime ISO.
    var endShort = endStr ? endStr.slice(0, 10) : '';
    var endLabel = t.actualEnd ? endShort : (endShort ? endShort + ' (resolved)' : '');
    if (!t.end || !endStr) {
      return 'Closed (status: ' + statusLabel + '). Missing actual or planned end date — cannot compare to plan.';
    }
    var projDate = parseDate(endStr);
    var baseDate = parseDate(t.end);
    if (!projDate || !baseDate) return 'Closed (status: ' + statusLabel + ').';
    var diff = Math.round((projDate - baseDate) / DAY_MS);
    var absDiff = Math.abs(diff);
    var dayWord = absDiff === 1 ? 'day' : 'days';
    if (s === 'Behind') {
      return 'Closed ' + endLabel + ', ' + absDiff + ' ' + dayWord + ' after the planned end ' + t.end + ' (>3-day tolerance).';
    }
    if (s === 'Ahead') {
      return 'Closed ' + endLabel + ', ' + absDiff + ' ' + dayWord + ' before the planned end ' + t.end + ' (>3-day tolerance).';
    }
    return 'Closed ' + endLabel + ' vs planned end ' + t.end + ' = within ±3 days.';
  }

  // In Progress: surface late / early start vs planned. Chip is On Track until
  // planned end is reached; once today is past planned end and the task is
  // still in progress (no actualEnd), the chip flips to Behind.
  if (isInProgress) {
    var actualStart = parseDate(t.actualStart);
    var plannedStart = parseDate(t.start);
    var lateNote = '';
    if (actualStart && plannedStart) {
      var sd = Math.round((actualStart - plannedStart) / DAY_MS);
      if (sd > 0) {
        lateNote = ' Started ' + sd + ' day' + (sd === 1 ? '' : 's') + ' late (planned ' + t.start + ').';
      } else if (sd < 0) {
        var ed = Math.abs(sd);
        lateNote = ' Started ' + ed + ' day' + (ed === 1 ? '' : 's') + ' early (planned ' + t.start + ').';
      }
    }
    var startedStr = t.actualStart ? 'Started ' + t.actualStart.slice(0, 10) + ' in Jira.' : 'Status: In Progress.';
    if (s === 'Behind' && t.end) {
      var planEndDate = parseDate(t.end);
      var todayD = new Date(); todayD.setHours(0,0,0,0);
      var overshoot = planEndDate ? Math.round((todayD - planEndDate) / DAY_MS) : 0;
      var dayW = overshoot === 1 ? 'day' : 'days';
      return startedStr + lateNote + ' Planned end ' + t.end + ' has passed (' + overshoot + ' ' + dayW + ' ago) and the task is still in progress.';
    }
    return startedStr + lateNote + ' On Track until planned end ' + (t.end || '—') + ' is reached.';
  }

  // Pre-start (To Do / Untriaged / Blocked / etc.).
  if (s === 'Late Start' && t.start) {
    return 'Status: ' + statusLabel + '. Planned start ' + t.start + ' has passed, but the task has not started in Jira yet.';
  }
  return 'Status: ' + statusLabel + '. Planned start ' + (t.start || '—') + ' has not yet been reached.';
}

function scheduleColor(s) {
  if (s === 'Behind')     return 'var(--red)';
  if (s === 'Late Start') return 'var(--amber)';
  if (s === 'Ahead')      return 'var(--blue)';
  if (s === 'On Track')   return 'var(--green)';
  if (s === 'Done')       return 'var(--text-muted)';
  return '#94a3b8';
}

function buildTshirtBadge(size) {
  if (!size) return '<span class="tshirt-none">-</span>';
  var raw = String(size).trim();

  // Normalize various Jira / Notion input shapes to S / M / L / XL.
  // Lowercase + strip spaces / dashes / underscores so "Extra Large",
  // "extra-large", "x-large", "XL " all collapse to the same key.
  var lc = raw.toLowerCase().replace(/[\s\-_]+/g, '');
  var info = null;
  if      (lc === 's'  || lc === 'small')                                              info = { k: 'S',  w: 'Small' };
  else if (lc === 'm'  || lc === 'med' || lc === 'medium')                             info = { k: 'M',  w: 'Medium' };
  else if (lc === 'l'  || lc === 'large' || lc === 'lrg' || lc === 'lg')               info = { k: 'L',  w: 'Large' };
  else if (lc === 'xl' || lc === 'xlarge' || lc === 'extralarge' || lc === 'xxl')      info = { k: 'XL', w: 'Extra Large' };

  if (info) {
    return '<span class="tshirt-badge tshirt-' + info.k + '">' +
      '<span class="tshirt-letter">' + info.k + '</span>' +
      '<span class="tshirt-word">' + info.w + '</span>' +
      '</span>';
  }
  // Unknown value — show raw text with title attribute so the value
  // isn't lost; if you see this in the UI, please share the value so
  // it can be added to the normalizer.
  return '<span class="tshirt-none" title="' + raw + '">' + raw + '</span>';
}

function buildRiskBadge(risk) {
  if (!risk) return '<span class="risk-none">-</span>';
  var r = String(risk).trim();
  var letter = r.charAt(0).toUpperCase();
  if (r === 'High' || r === 'Medium' || r === 'Low') {
    return '<span class="risk-badge risk-' + r + '">' +
      '<span class="risk-letter">' + letter + '</span>' +
      '<span class="risk-word">' + r + '</span>' +
      '</span>';
  }
  return '<span class="risk-none" title="' + r + '">' + r + '</span>';
}

// "Youngjeong Yu" → "Youngjeong Y."
function shortName(name) {
  if (!name) return '-';
  var parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0];
  return parts[0] + ' ' + parts[parts.length - 1].charAt(0) + '.';
}

function isPrdDone(prd) {
  return getPrdState(prd) === 'done';
}
function getPMList() {
  const pms = new Set();
  ALL_TASKS.forEach(function(t) {
    if (!t.pm) return;
    t.pm.split(',').forEach(function(p) { const n=p.trim(); if(n) pms.add(n); });
  });
  return Array.from(pms).sort();
}
function matchesPM(pmField, target) {
  if (!pmField) return false;
  return pmField.split(',').map(function(p){return p.trim();}).includes(target);
}

function toggleDeps() {
  showDeps = !showDeps;
  var btn = document.getElementById('dep-toggle');
  if (btn) btn.classList.toggle('active', showDeps);
  if (showDeps) drawDependencies(); else {
    var old = document.getElementById('dep-svg');
    if (old) old.parentNode.removeChild(old);
  }
}

function toggleShowActual() {
  showActual = !showActual;
  try { localStorage.setItem('esl-show-actual', showActual ? '1' : '0'); } catch(e) {}
  renderAll(null);
}

// ── What's-new tour overlay (sequential walkthrough) ─────────────
var TOUR_STEPS = [
  { sel: '.summary-cards', title: 'Progress widgets', desc: 'Top cards now show Complete / Total at a glance.' },
  { sel: '#schedule-strip', title: 'Schedule filter', desc: 'Click pills to filter Behind / On Track / Ahead.' },
  { sel: '.prd-pm-card', title: 'PRD by PM', desc: 'Tasks needing PRD are grouped by owner. Click the Jira key to open in Jira.' },
  { sel: 'th[data-col="risk"]', title: 'Risk chips', desc: 'L / M / H color chips. Hover any chip for the full Low / Medium / High label.' },
  { sel: '#actual-toggle', title: 'Show Actual', desc: 'Toggle on to surface actual start/end dates from Jira alongside the planned ones.' },
  { sel: 'th[data-col="start"]', title: 'Plan vs Actual', desc: 'Start/End columns are now Plan dates. Act Start / Act End appear when Show Actual is on.' }
];
var tourIdx = 0;

function tourKeyHandler(e) {
  if (e.key === 'Escape') closeTour();
  else if (e.key === 'ArrowRight' || e.key === 'Enter') tourNext();
  else if (e.key === 'ArrowLeft') tourPrev();
}

function tourScrollHandler() { positionTourElements(); }

function closeTour() {
  var existing = document.getElementById('tour-overlay');
  if (existing) existing.parentNode.removeChild(existing);
  document.removeEventListener('keydown', tourKeyHandler);
  window.removeEventListener('scroll', tourScrollHandler);
  try { localStorage.setItem('esl-tour-seen', '1'); } catch(e) {}
}

function tourNext() {
  if (tourIdx < TOUR_STEPS.length - 1) { tourIdx++; renderTourStep(); }
  else closeTour();
}

function tourPrev() {
  if (tourIdx > 0) { tourIdx--; renderTourStep(); }
}

function runTour() {
  closeTour();
  tourIdx = 0;
  var trigger = document.getElementById('tour-trigger');
  if (trigger) trigger.classList.remove('attention');
  var overlay = document.createElement('div');
  overlay.id = 'tour-overlay';
  // Skip button (persistent across steps)
  var skipBtn = document.createElement('button');
  skipBtn.className = 'tour-skip-btn';
  skipBtn.textContent = 'Skip ✕';
  skipBtn.onclick = closeTour;
  overlay.appendChild(skipBtn);
  document.body.appendChild(overlay);
  document.addEventListener('keydown', tourKeyHandler);
  window.addEventListener('scroll', tourScrollHandler, { passive: true });
  renderTourStep();
}

function positionTourElements() {
  var overlay = document.getElementById('tour-overlay');
  if (!overlay) return;
  var step = TOUR_STEPS[tourIdx];
  var target = document.querySelector(step.sel);
  if (!target) return;
  var rect = target.getBoundingClientRect();

  var spot = overlay.querySelector('.tour-spotlight');
  if (spot) {
    spot.style.left = (rect.left - 6) + 'px';
    spot.style.top = (rect.top - 6) + 'px';
    spot.style.width = (rect.width + 12) + 'px';
    spot.style.height = (rect.height + 12) + 'px';
  }

  var label = overlay.querySelector('.tour-label-seq');
  if (label) {
    var labelW = 280, labelH = 140;
    var spaceBelow = window.innerHeight - rect.bottom;
    var spaceAbove = rect.top;
    var labelTop;
    if (spaceBelow >= labelH + 30) labelTop = rect.bottom + 18;
    else if (spaceAbove >= labelH + 30) labelTop = Math.max(20, rect.top - labelH - 18);
    else labelTop = Math.max(20, Math.min(window.innerHeight - labelH - 20, rect.top + rect.height / 2 - labelH / 2));
    var labelLeft = Math.max(20, Math.min(window.innerWidth - labelW - 20, rect.left + rect.width / 2 - labelW / 2));
    label.style.left = labelLeft + 'px';
    label.style.top = labelTop + 'px';
  }
}

function renderTourStep() {
  var overlay = document.getElementById('tour-overlay');
  if (!overlay) return;

  var step = TOUR_STEPS[tourIdx];
  var target = document.querySelector(step.sel);
  if (!target) {
    if (tourIdx < TOUR_STEPS.length - 1) { tourIdx++; return renderTourStep(); }
    return closeTour();
  }
  var rect = target.getBoundingClientRect();
  if (rect.width === 0 && rect.height === 0) {
    if (tourIdx < TOUR_STEPS.length - 1) { tourIdx++; return renderTourStep(); }
    return closeTour();
  }

  // Get or create spotlight + label (persisted across steps)
  var spot = overlay.querySelector('.tour-spotlight');
  if (!spot) {
    spot = document.createElement('div');
    spot.className = 'tour-spotlight';
    overlay.appendChild(spot);
  }
  var label = overlay.querySelector('.tour-label-seq');
  if (!label) {
    label = document.createElement('div');
    label.className = 'tour-label-seq';
    label.style.width = '280px';
    overlay.appendChild(label);
  }

  // Update label content
  label.innerHTML =
    '<div class="tour-step-num">What\'s New ' + (tourIdx + 1) + ' / ' + TOUR_STEPS.length + '</div>' +
    '<div class="tour-title">' + step.title + '</div>' +
    '<div class="tour-desc">' + step.desc + '</div>' +
    '<div class="tour-actions">' +
      (tourIdx > 0
        ? '<button class="tour-btn-secondary" id="tour-prev-btn">← Prev</button>'
        : '<span></span>') +
      '<button class="tour-btn-primary" id="tour-next-btn">' + (tourIdx === TOUR_STEPS.length - 1 ? 'Done ✓' : 'Next →') + '</button>' +
    '</div>';

  var nextBtn = document.getElementById('tour-next-btn');
  if (nextBtn) nextBtn.onclick = tourNext;
  var prevBtn = document.getElementById('tour-prev-btn');
  if (prevBtn) prevBtn.onclick = tourPrev;

  // Smooth animation between steps (spot/label glide; page itself jumps instantly)
  spot.classList.add('step-change');
  label.classList.add('step-change');

  // Instant page scroll so we can read the post-scroll rect synchronously and avoid
  // any prediction guesswork (which got it wrong for top-of-page elements).
  target.scrollIntoView({ behavior: 'auto', block: 'center' });
  var postRect = target.getBoundingClientRect();

  spot.style.left = (postRect.left - 6) + 'px';
  spot.style.top = (postRect.top - 6) + 'px';
  spot.style.width = (postRect.width + 12) + 'px';
  spot.style.height = (postRect.height + 12) + 'px';

  var labelW = 280, labelH = 140;
  var spaceBelow = window.innerHeight - postRect.bottom;
  var spaceAbove = postRect.top;
  var labelTop;
  if (spaceBelow >= labelH + 30) labelTop = postRect.bottom + 18;
  else if (spaceAbove >= labelH + 30) labelTop = Math.max(20, postRect.top - labelH - 18);
  else labelTop = Math.max(20, Math.min(window.innerHeight - labelH - 20, postRect.top + postRect.height / 2 - labelH / 2));
  var labelLeft = Math.max(20, Math.min(window.innerWidth - labelW - 20, postRect.left + postRect.width / 2 - labelW / 2));
  label.style.left = labelLeft + 'px';
  label.style.top = labelTop + 'px';

  // Drop the transition class after the glide so any subsequent user-scroll tracking
  // is responsive (positionTourElements updates take effect immediately).
  setTimeout(function() {
    if (spot) spot.classList.remove('step-change');
    if (label) label.classList.remove('step-change');
  }, 320);
}

function maybeAutoTour() {
  try {
    if (localStorage.getItem('esl-tour-seen') === '1') return;
  } catch(e) {}
  // Delay matches the Guide button's attention pulse window — gives the user
  // a chance to notice the pulse and click it; if they don't, the tour pops
  // up on its own.
  setTimeout(runTour, 8000);
}

function drawDependencies() {
  var old = document.getElementById('dep-svg');
  if (old) old.parentNode.removeChild(old);
  if (!showDeps) return;

  var container = document.querySelector('.timeline-container');
  var table = container ? container.querySelector('table.timeline') : null;
  if (!container || !table) return;

  // epic key / task name → task data
  var taskMap = {};
  var taskNameMap = {};
  ALL_TASKS.forEach(function(t) {
    if (t.epic) taskMap[t.epic] = t;
    if (t.task) taskNameMap[t.task] = t;
  });

  // epic key / task name → visible DOM row
  var rowMap = {};
  var rowNameMap = {};
  table.querySelectorAll('tr.task-row').forEach(function(row) {
    var e = row.getAttribute('data-epic');
    var n = row.getAttribute('data-task');
    if (e) rowMap[e] = row;
    if (n) rowNameMap[n] = row;
  });

  // left edge of gantt column
  var ganttTh = table.querySelector('th.gantt-col');
  if (!ganttTh) return;
  var ganttLeft = ganttTh.offsetLeft;

  // absolute top of container in page
  var containerPageTop = container.getBoundingClientRect().top + window.pageYOffset;

  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.id = 'dep-svg';
  svg.setAttribute('width', table.offsetWidth);
  svg.setAttribute('height', table.offsetHeight);
  // SVG itself has no fill / no rect — empty areas have no painted content, so
  // clicks through empty bezier interior fall through to the table behind. The
  // visible path strokes are pointer-events:none so they don't compete with the
  // wider transparent hit paths that own the <title> tooltips.
  svg.style.cssText = 'position:absolute;top:0;left:0;z-index:10;';

  // arrowhead marker
  var defs = document.createElementNS(NS, 'defs');
  var marker = document.createElementNS(NS, 'marker');
  marker.setAttribute('id', 'dep-arrow');
  marker.setAttribute('markerWidth', '7');
  marker.setAttribute('markerHeight', '7');
  marker.setAttribute('refX', '5');
  marker.setAttribute('refY', '3.5');
  marker.setAttribute('orient', 'auto');
  var poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', '0,0 0,7 7,3.5');
  poly.setAttribute('fill', '#e5a44b');
  marker.appendChild(poly);
  defs.appendChild(marker);
  svg.appendChild(defs);

  function rowYCenter(row) {
    return (row.getBoundingClientRect().top + window.pageYOffset) - containerPageTop + row.offsetHeight / 2;
  }

  function drawArrow(fromKey, fromTask, toKey, toTask, arrowSet) {
    var arrowKey = (fromKey||fromTask.task) + '->' + (toKey||toTask.task);
    if (arrowSet[arrowKey]) return false;
    arrowSet[arrowKey] = true;

    var fromRow = rowMap[fromKey||''] || rowNameMap[fromTask.task||''];
    var toRow   = rowMap[toKey||'']   || rowNameMap[toTask.task||''];
    if (!fromRow || !toRow) return false;

    var endDate   = parseDate(fromTask.end);
    var startDate = parseDate(toTask.start);
    if (!endDate || !startDate) return false;

    var x1 = ganttLeft + dayToPx(dayOffset(endDate));
    var x2 = ganttLeft + dayToPx(dayOffset(startDate));
    var y1 = rowYCenter(fromRow);
    var y2 = rowYCenter(toRow);

    var dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
    var d = 'M' + x1 + ',' + y1 +
            ' C' + (x1+dx) + ',' + y1 + ' ' + (x2-dx) + ',' + y2 + ' ' + x2 + ',' + y2;
    var titleText = 'Blocks: ' + (fromKey || fromTask.task) + ' → ' + (toKey || toTask.task);

    // Wide transparent hit path — easy to hover, owns the <title>
    var hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('fill', 'none');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '12');
    hit.setAttribute('pointer-events', 'stroke');
    var ttl = document.createElementNS(NS, 'title');
    ttl.textContent = titleText;
    hit.appendChild(ttl);
    svg.appendChild(hit);

    // Visible styled path — thin, dashed, with arrowhead. pointer-events:none so it doesn't compete with the hit path.
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#e5a44b');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-dasharray', '5 3');
    path.setAttribute('marker-end', 'url(#dep-arrow)');
    path.setAttribute('opacity', '0.75');
    path.setAttribute('pointer-events', 'none');
    svg.appendChild(path);
    return true;
  }

  // Relates link — bidirectional, no arrowhead, blue dotted, anchored at each task's plan start.
  // Returns true if drawn, false otherwise.
  function drawRelatesLink(taskA, taskB) {
    var rowA = rowMap[taskA.epic || ''] || rowNameMap[taskA.task || ''];
    var rowB = rowMap[taskB.epic || ''] || rowNameMap[taskB.task || ''];
    if (!rowA || !rowB) return false;
    var aStart = parseDate(taskA.start);
    var bStart = parseDate(taskB.start);
    if (!aStart || !bStart) return false;

    var x1 = ganttLeft + dayToPx(dayOffset(aStart));
    var x2 = ganttLeft + dayToPx(dayOffset(bStart));
    var y1 = rowYCenter(rowA);
    var y2 = rowYCenter(rowB);

    var dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
    var d = 'M' + x1 + ',' + y1 +
            ' C' + (x1+dx) + ',' + y1 + ' ' + (x2-dx) + ',' + y2 + ' ' + x2 + ',' + y2;
    var titleText = 'Relates: ' + (taskA.epic || taskA.task) + ' ↔ ' + (taskB.epic || taskB.task);

    // Wide transparent hit path
    var hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('fill', 'none');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '12');
    hit.setAttribute('pointer-events', 'stroke');
    var ttl = document.createElementNS(NS, 'title');
    ttl.textContent = titleText;
    hit.appendChild(ttl);
    svg.appendChild(hit);

    // Visible styled path
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#5b8af5');
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-dasharray', '0.1 5');
    path.setAttribute('opacity', '0.95');
    path.setAttribute('pointer-events', 'none');
    svg.appendChild(path);
    return true;
  }

  var arrowSet = {};   // 'A->B' Blocks dedup
  var relatesSet = {}; // 'min<->max' canonical Relates dedup
  var drawn = 0;

  // Direction 1: t.blocking — this task blocks others (FROM t.end TO target.start)
  ALL_TASKS.forEach(function(t) {
    if (!t.blocking || !t.blocking.length) return;
    t.blocking.forEach(function(target) {
      var toTask = taskMap[target] || taskNameMap[target];
      if (!toTask) return;
      if (drawArrow(t.epic, t, target, toTask, arrowSet)) drawn++;
    });
  });

  // Direction 2: t.blockedBy — this task is blocked by others (FROM blocker.end TO t.start)
  ALL_TASKS.forEach(function(t) {
    if (!t.blockedBy || !t.blockedBy.length) return;
    t.blockedBy.forEach(function(blocker) {
      var fromTask = taskMap[blocker] || taskNameMap[blocker];
      if (!fromTask) return;
      if (drawArrow(blocker, fromTask, t.epic, t, arrowSet)) drawn++;
    });
  });

  // Direction 3: t.relates — bidirectional, dedupe pairs, defer to Blocks if same pair already drew
  ALL_TASKS.forEach(function(t) {
    if (!t.epic || !t.relates || !t.relates.length) return;
    t.relates.forEach(function(otherKey) {
      if (otherKey === t.epic) return;                // self-link guard
      var other = taskMap[otherKey];
      if (!other) return;
      // Skip if this pair already drew as Blocks (in either direction)
      if (arrowSet[t.epic + '->' + otherKey]) return;
      if (arrowSet[otherKey + '->' + t.epic]) return;
      var pair = [t.epic, otherKey].sort().join('<->');
      if (relatesSet[pair]) return;
      relatesSet[pair] = true;
      if (drawRelatesLink(t, other)) drawn++;
    });
  });

  if (drawn > 0) container.appendChild(svg);
}

function toggleTheme() {
  var toLight = !document.body.classList.contains('light-mode');
  document.body.classList.toggle('light-mode');
  document.getElementById('theme-toggle').textContent = toLight ? 'Dark Mode' : 'Light Mode';
  try { localStorage.setItem('esl-theme', toLight ? 'light' : 'dark'); } catch(e) {}
}
(function() {
  try {
    var saved = localStorage.getItem('esl-theme');
    if (saved !== 'dark') {
      document.body.classList.add('light-mode');
      var btn = document.getElementById('theme-toggle');

        setTimeout(function() { guideBtn.classList.remove('attention'); }, 8000);

/* ── Export (PNG / PDF) ── */
function toggleExportMenu() {
  var menu = document.getElementById('export-menu');
  if (!menu) return;
  var isOpen = menu.style.display !== 'none';
  menu.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    setTimeout(function() {
      document.addEventListener('click', closeExportOnOutside);
    }, 0);
  }
}
function closeExportOnOutside(e) {
  if (!e.target.closest('#export-wrap')) {
    var menu = document.getElementById('export-menu');
    if (menu) menu.style.display = 'none';
    document.removeEventListener('click', closeExportOnOutside);
  }
}

function exportTimeline(format) {
  var menu = document.getElementById('export-menu');
  if (menu) menu.style.display = 'none';

  var btn = document.getElementById('export-btn');
  var origText = btn.innerHTML;
  btn.innerHTML = 'Exporting&#8230;';
  btn.disabled = true;

  var scrollWrap = document.getElementById('scroll-wrap');
  var tooltip = document.getElementById('tooltip');
  var tourOverlay = document.getElementById('tour-overlay');

  if (tooltip) tooltip.style.display = 'none';
  if (tourOverlay) tourOverlay.style.display = 'none';

  /* temporarily expand for full-content capture */
  var origH   = scrollWrap.style.height;
  var origOF  = scrollWrap.style.overflow;
  var origBOF = document.body.style.overflow;
  scrollWrap.style.height   = 'auto';
  scrollWrap.style.overflow = 'visible';
  document.body.style.overflow = 'visible';

  var bgColor = document.body.classList.contains('light-mode') ? '#dfe3f0' : '#0d1117';

  html2canvas(scrollWrap, {
    scale: 2,
    useCORS: true,
    backgroundColor: bgColor,
    logging: false,
    windowWidth: scrollWrap.scrollWidth
  }).then(function(canvas) {
    restore();
    var dateStr = new Date().toISOString().slice(0, 10);

    if (format === 'png') {
      var link = document.createElement('a');
      link.download = 'ESL-Timeline-' + dateStr + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } else if (format === 'pdf') {
      var jsPDF = window.jspdf.jsPDF;
      var imgData = canvas.toDataURL('image/png');
      var pdf = new jsPDF('l', 'mm', 'a4');
      var pdfW = pdf.internal.pageSize.getWidth();
      var pdfH = pdf.internal.pageSize.getHeight();

      /* scale image width to fit page width */
      var ratio   = pdfW / canvas.width;
      var scaledH = canvas.height * ratio;

      if (scaledH <= pdfH) {
        pdf.addImage(imgData, 'PNG', 0, 0, pdfW, scaledH);
      } else {
        /* multi-page: draw full image offset upward per page */
        var pages = Math.ceil(scaledH / pdfH);
        for (var i = 0; i < pages; i++) {
          if (i > 0) pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, -(i * pdfH), pdfW, scaledH);
        }
      }
      pdf.save('ESL-Timeline-' + dateStr + '.pdf');
    }
  }).catch(function(err) {
    restore();
    console.error('Export failed:', err);
  });

  function restore() {
    scrollWrap.style.height   = origH;
    scrollWrap.style.overflow = origOF;
    document.body.style.overflow = origBOF;
    if (tooltip) tooltip.style.display = '';
    if (tourOverlay) tourOverlay.style.display = '';
    btn.innerHTML = origText;
    btn.disabled = false;
  }
}

// ── Late reason modal (opens from gantt-overrun click via delegated handler) ──
var lateReasonContext = null;  // { jiraKey, taskName }

function openLateReasonModal(jiraKey, taskName) {
  if (!jiraKey) return;
  lateReasonContext = { jiraKey: jiraKey, taskName: taskName || '' };
  document.getElementById('late-reason-task').textContent = '[' + jiraKey + ']' + (taskName ? '  ' + taskName : '');
  document.getElementById('late-reason-text').value = '';
  setLateReasonStatus('', '');
  document.getElementById('late-reason-submit').disabled = false;
  // Author name — saved once in localStorage, then auto-prefixed thereafter
  var savedName = '';
  try { savedName = localStorage.getItem('esl-author-name') || ''; } catch (e) {}
  var nameRow = document.getElementById('late-reason-name-row');
  if (savedName) {
    nameRow.style.display = 'none';
  } else {
    nameRow.style.display = '';
    document.getElementById('late-reason-name').value = '';
  }
  document.getElementById('late-reason-overlay').classList.add('show');
  setTimeout(function() {
    var firstInput = savedName
      ? document.getElementById('late-reason-text')
      : document.getElementById('late-reason-name');
    if (firstInput) firstInput.focus();
  }, 60);
}

function closeLateReasonModal() {
  document.getElementById('late-reason-overlay').classList.remove('show');
  lateReasonContext = null;
}

function setLateReasonStatus(msg, type) {
  var el = document.getElementById('late-reason-status');
  el.textContent = msg || '';
  el.className = 'late-reason-status' + (type ? ' ' + type : '');
}

function submitLateReason() {
  if (!lateReasonContext) return;
  var reason = document.getElementById('late-reason-text').value.trim();
  if (!reason) { setLateReasonStatus('Please write a reason.', 'error'); return; }

  var name = '';
  try { name = localStorage.getItem('esl-author-name') || ''; } catch (e) {}
  if (!name) {
    var typed = document.getElementById('late-reason-name').value.trim();
    if (!typed) { setLateReasonStatus('Please enter your name.', 'error'); return; }
    name = typed;
    try { localStorage.setItem('esl-author-name', name); } catch (e) {}
  }
  // Prefix with "Late reason —" so the comment reads sensibly when viewed
  // in Jira out of timeline context. The "[Name]" tag preserves attribution.
  var body = 'Late reason — [' + name + '] ' + reason;

  var btn = document.getElementById('late-reason-submit');
  btn.disabled = true;
  setLateReasonStatus('Posting to Jira…', 'info');

  postJiraComment(lateReasonContext.jiraKey, body)
    .then(function(res) {
      if (res && res.ok) {
        var key = lateReasonContext.jiraKey;
        // Optimistically append the new comment to the local task so the
        // late tooltip reflects it immediately, without waiting for the
        // server's 5-min cache to expire.
        var task = ALL_TASKS && ALL_TASKS.find(function(t) { return t.epic === key; });
        if (task) {
          if (!Array.isArray(task.lateComments)) task.lateComments = [];
          task.lateComments.push(res.comment || { author: name, body: body, created: new Date().toISOString() });
        }
        closeLateReasonModal();
        showToast('Comment posted to ' + key, 'success');
      } else {
        var msg = (res && res.error) || 'Unknown error';
        setLateReasonStatus('Failed: ' + msg, 'error');
        btn.disabled = false;
      }
    })
    .catch(function(err) {
      setLateReasonStatus('Network error: ' + err.message, 'error');
      btn.disabled = false;
    });
}

function postJiraComment(jiraKey, text) {
  // Apps Script webapps run their HtmlService page inside a sandbox iframe
  // on a different origin, so window.location.href doesn't point at the
  // /exec endpoint and fetch() returns the HTML page instead of JSON.
  // The supported way to reach server-side code is google.script.run.
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(res) { resolve(res); })
      .withFailureHandler(function(err) { reject(err); })
      .postJiraCommentFromUI(jiraKey, text);
  });
}

// ── Toast notifications ──
function showToast(msg, type, durationMs) {
  var container = document.getElementById('toast-container');
  if (!container) return;
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() {
    el.style.transition = 'opacity 0.2s ease';
    el.style.opacity = '0';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, durationMs || 3500);
}

// Delegated click handler for gantt-overrun (red hatched Late segments).
// Lives on body so it survives every renderAll() rerender of the timeline.
document.body.addEventListener('click', function(e) {
  var el = e.target.closest && e.target.closest('.gantt-overrun');
  if (!el) return;
  var jira = el.getAttribute('data-jira');
  if (!jira) return;
  e.preventDefault();
  e.stopPropagation();
  openLateReasonModal(jira, el.getAttribute('data-task') || '');
}, true);  // capture phase — preempts the seg() inline onclick that opens Jira

// ── Late tooltip on overrun hover ──
var lateTooltipTimer = null;

function escapeHtmlBasic(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtCommentDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function showLateTooltip(barEl, e) {
  var jira = barEl.getAttribute('data-jira');
  if (!jira || !Array.isArray(ALL_TASKS)) return;
  var task = ALL_TASKS.find(function(t) { return t.epic === jira; });
  if (!task) return;
  var tt = document.getElementById('late-tooltip');
  if (!tt) return;

  var planEnd = task.end       ? fmtShort(parseDate(task.end))       : '?';
  var actEnd  = task.actualEnd ? fmtShort(parseDate(task.actualEnd)) : '?';
  var html = '<div class="late-tooltip-date">Late · plan ' + planEnd + ' → actual ' + actEnd + '</div>';

  var comments = task.lateComments || [];
  if (comments.length === 0) {
    html += '<div class="late-tooltip-empty">No reasons logged yet.</div>';
  } else {
    html += '<div class="late-tooltip-comments">' + comments.map(function(c) {
      var when = fmtCommentDate(c.created);
      var meta = escapeHtmlBasic(c.author || 'Unknown') + (when ? ' · ' + when : '');
      return '<div class="late-tooltip-comment">' +
        '<div class="late-tooltip-comment-meta">' + meta + '</div>' +
        '<div class="late-tooltip-comment-body">' + escapeHtmlBasic(c.body) + '</div>' +
        '</div>';
    }).join('') + '</div>';
  }
  html += '<div class="late-tooltip-hint">Click bar to add reason</div>';

  tt.innerHTML = html;
  tt.classList.add('show');
  positionLateTooltip(e);
}

function positionLateTooltip(e) {
  var tt = document.getElementById('late-tooltip');
  if (!tt || !tt.classList.contains('show')) return;
  var w = tt.offsetWidth || 280;
  var h = tt.offsetHeight || 100;
  var pad = 12;
  var left = e.clientX + pad;
  var top  = e.clientY + pad;
  if (left + w > window.innerWidth  - 8) left = e.clientX - w - pad;
  if (top  + h > window.innerHeight - 8) top  = e.clientY - h - pad;
  tt.style.left = left + 'px';
  tt.style.top  = top  + 'px';
}

function hideLateTooltip() {
  if (lateTooltipTimer) { clearTimeout(lateTooltipTimer); lateTooltipTimer = null; }
  var tt = document.getElementById('late-tooltip');
  if (tt) tt.classList.remove('show');
}

document.body.addEventListener('mouseover', function(e) {
  var el = e.target.closest && e.target.closest('.gantt-overrun');
  if (!el) return;
  hideLateTooltip();
  var capturedE = e;  // freeze for delayed callback
  lateTooltipTimer = setTimeout(function() { showLateTooltip(el, capturedE); }, 250);
});
document.body.addEventListener('mouseout', function(e) {
  var el = e.target.closest && e.target.closest('.gantt-overrun');
  if (!el) return;
  hideLateTooltip();
});
document.body.addEventListener('mousemove', function(e) {
  var el = e.target.closest && e.target.closest('.gantt-overrun');
  if (!el) return;
  var tt = document.getElementById('late-tooltip');
  if (tt && tt.classList.contains('show')) positionLateTooltip(e);
});

// ESC closes the modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && lateReasonContext) closeLateReasonModal();
});

loadData();
maybeAutoTour();
